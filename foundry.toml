[profile.default]
solc = "0.8.37"
src = "contracts"
test = "forge-test"
libs = ["lib", "node_modules"]
optimizer = true
optimizer_runs = 40
via_ir = true
evm_version = "shanghai"
bytecode_hash = "none"
revert_strings = "strip"
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/"
]
fs_permissions = [{ access = "read", path = "./" }]

# SOL-2026-7: exact default sequence minus LoadResolver/EqualStoreEliminator.
[profile.default.optimizer_details.yulDetails]
optimizerSteps = "dfDvulfnTUtnIfxa[r]scMVcul[j]Trpeulxa[r]cvifMCTUca[r]SsTFOtfDnca[r]IulcscCTUtvifMx[scCTUt]TOntnfDIulvifMjmul[jul]VcTOculjmul:fDnTOcmuO"

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 80


[profile.ci]
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 64 }
