[profile.default]
solc = "0.8.23"
src = "contracts"
test = "forge-test"
libs = ["lib", "node_modules"]
optimizer = true
optimizer_runs = 40
evm_version = "shanghai"
bytecode_hash = "none"
revert_strings = "strip"
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/"
]
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 40


[profile.ci]
fuzz = { runs = 256 }
invariant = { runs = 48, depth = 35 }
