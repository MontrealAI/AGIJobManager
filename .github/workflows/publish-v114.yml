name: Publish v1.14.0 after final-source qualification
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter PUBLISH_v1.14.0 after reviewing completed final-source qualification'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-v1.14.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_v1.14.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Consume completed exact-source runs and immutable candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/release/collect-qualification.py --source "$SOURCE_COMMIT" --out build/release/v1.14.0
      - name: Validate evidence, create draft, verify assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 scripts/release/publish-release.py --qualification build/release/v1.14.0/QUALIFICATION.json --assets build/release/v1.14.0 --publish
