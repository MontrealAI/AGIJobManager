name: Publish reviewed release after final-source qualification
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter PUBLISH_v1.18.0 after reviewing completed final-source qualification'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-v1.18.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_v1.18.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Consume completed exact-source runs and immutable candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/release/collect-qualification.py --source "$SOURCE_COMMIT" --out build/release/v1.18.0
      - name: Verify complete published download inventory
        run: python3 scripts/release/verify-package.py build/release/v1.18.0 --published
      - name: Attest exact-source release assembly
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/release/v1.18.0/*
      - name: Verify artifact, repository, workflow and source attestation bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in build/release/v1.18.0/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-v114.yml" --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" --source-ref refs/heads/main --deny-self-hosted-runners
          done
      - name: Validate evidence, create draft, verify assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 scripts/release/publish-release.py --qualification build/release/v1.18.0/QUALIFICATION.json --assets build/release/v1.18.0 --publish
