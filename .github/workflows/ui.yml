name: UI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify qualified source checkout
        env:
          QUALIFICATION_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$QUALIFICATION_SOURCE"
          printf 'QUALIFIED_SOURCE_COMMIT=%s\n' "$actual"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run check:no-binaries
        working-directory: .
      - run: npm ci
      - name: Check reviewed audit disposition controls with installed UI dependencies
        run: node --test ../scripts/security/zod-audit-disposition.test.cjs
      - name: Check UI registry audit and bounded backport disposition
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/security/audit-ui"
          set +e
          npm audit --json --audit-level=low > "$GITHUB_WORKSPACE/build/security/audit-ui"/raw.json 2> "$GITHUB_WORKSPACE/build/security/audit-ui"/stderr.txt
          audit_exit=$?
          set -e
          printf '%s\n' "$audit_exit" > "$GITHUB_WORKSPACE/build/security/audit-ui"/exit.txt
          node ../scripts/check-zod-backport-audit.cjs --repository "$GITHUB_WORKSPACE" --scope ui \
            --audit "$GITHUB_WORKSPACE/build/security/audit-ui"/raw.json --stderr "$GITHUB_WORKSPACE/build/security/audit-ui"/stderr.txt \
            --exit-file "$GITHUB_WORKSPACE/build/security/audit-ui"/exit.txt --output "$GITHUB_WORKSPACE/build/security/audit-ui"/disposition.json
      - run: npm run check:no-binaries
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run test:fuzz
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y
      - run: npm run test:headers
      - run: npm run build:ipfs
      - run: npm run test:security
      - run: npm run docs:check
      - run: npm run verify:ipfs
      - run: npm run verify:deterministic
      - run: env -u NEXT_PUBLIC_DEMO_MODE -u NEXT_PUBLIC_DEMO_ACTOR -u NEXT_PUBLIC_CHAIN_ID -u NEXT_PUBLIC_AGI_JOB_MANAGER_ADDRESS -u NEXT_PUBLIC_USDC_TOKEN_ADDRESS npm run verify:committed-html

      - name: Preserve raw UI registry audit and source disposition
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-source-bound-audit-evidence
          path: build/security/audit-ui/
          if-no-files-found: error
