name: Security Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify deployment toolchain
        working-directory: hardhat
        run: |
          npm ci
          npm audit --audit-level=high
          npm run compile
          npm run test:preflight
          npm run test:deployment

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Forge format check
        run: forge fmt --check forge-test/**/*.sol contracts/test/MaliciousCompletionReceiver.sol

      - name: Forge build
        run: FOUNDRY_PROFILE=ci forge build

      - name: Forge unit + fuzz tests
        run: FOUNDRY_PROFILE=ci forge test --no-match-path "forge-test/invariant/*.t.sol"

      - name: Forge invariants
        run: FOUNDRY_PROFILE=ci forge test --match-path "forge-test/invariant/*.t.sol"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install Slither
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer==0.11.6

      - name: Run Slither
        run: npm run slither

      - name: Run and review extended Slither findings
        run: |
          python3 scripts/security/test-slither-review.py
          npm run slither:extended

      - name: Preserve static analysis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-analysis-evidence
          path: build/security/*.json
          if-no-files-found: warn
