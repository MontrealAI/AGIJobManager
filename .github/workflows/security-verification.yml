name: Security Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check all root dependencies
        run: npm audit --audit-level=low

      - name: Verify exact compiler compatibility patches
        run: node --test scripts/security/test-compiler-compatibility.cjs scripts/security/test-artifact-diagnostics.cjs

      - name: Verify deployment toolchain
        working-directory: hardhat
        run: |
          npm ci
          npm audit --audit-level=low
          npm run compile
          npm run test:preflight
          npm run test:deployment

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Forge format check
        run: forge fmt --check forge-test/**/*.sol contracts/test/MaliciousCompletionReceiver.sol

      - name: Forge build
        run: FOUNDRY_PROFILE=ci forge build --deny warnings

      - name: Forge unit + fuzz tests
        run: FOUNDRY_PROFILE=ci forge test --no-match-path "forge-test/invariant/*.t.sol"

      - name: Forge invariants
        run: FOUNDRY_PROFILE=ci forge test --match-path "forge-test/invariant/*.t.sol"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install Slither
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer==0.11.6

      - name: Run and review extended Slither findings
        run: |
          python3 scripts/security/test-slither-review.py
          npm run slither:extended

      - name: Preserve static analysis evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: static-analysis-evidence
          path: build/security/*.json
          if-no-files-found: error
