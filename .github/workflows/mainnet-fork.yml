name: Mainnet USDC Fork Qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mainnet-usdc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hardhat/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: hardhat
      - name: Test actual Circle USDC on a pinned local mainnet fork
        working-directory: hardhat
        run: npm run test:mainnet-fork
        env:
          MAINNET_FORK_RPC_URL: https://eth-mainnet.g.alchemy.com/public
