name: Mainnet USDC Fork Qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mainnet-usdc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify qualified source checkout
        env:
          QUALIFICATION_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$QUALIFICATION_SOURCE"
          printf 'QUALIFIED_SOURCE_COMMIT=%s\n' "$actual"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hardhat/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: hardhat
      - name: Test actual Circle USDC on a pinned local mainnet fork
        working-directory: hardhat
        run: npm run test:mainnet-fork
        env:
          MAINNET_FORK_RPC_URL: https://eth-mainnet.g.alchemy.com/public
      - name: Rehearse USDC and ENS cutover beside the actual legacy manager
        working-directory: hardhat
        run: npm run test:cutover
        env:
          MAINNET_FORK_RPC_URL: https://eth-mainnet.g.alchemy.com/public
          CUTOVER_REPORT: ../build/qualification/mainnet-cutover.json
      - name: Match the committed qualification to the executed source and observations
        run: cmp docs/qualification/mainnet-cutover.json build/qualification/mainnet-cutover.json
      - name: Preserve source-bound cutover evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mainnet-cutover-qualification
          path: build/qualification/mainnet-cutover.json
          if-no-files-found: error
