name: Publish Discovery release after final-source qualification
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter PUBLISH_v1.20.1 after reviewing completed final-source qualification'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-v1.20.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PUBLISH_v1.20.1'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      RELEASE_PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Verify publication source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Install the exact compiler dependency closure
        run: |
          npm ci
          npm --prefix hardhat ci
      - name: Capture the exact reviewed Alpha implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: MontrealAI/AGI-Alpha-Agent-v0
          # Draft pin: pending final Alpha review and fresh native qualification.
          ref: 61532fb82621a065e668fd11e57289dcfb65c67b
          path: build/discovery-alpha
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate the installed native source from Manager inputs
        run: |
          test ! -e "$RUNNER_TEMP/discovery-alpha"
          mv "$GITHUB_WORKSPACE/build/discovery-alpha" "$RUNNER_TEMP/discovery-alpha"
      - name: Wait for all nine exact-source workflows
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/wait-qualification.py --source "$SOURCE_COMMIT" --profile manager-discovery-release-v1
      - name: Refuse superseded or unready publication
        if: steps.readiness.outputs.ready != 'true'
        run: exit 1
      - name: Consume completed exact-source runs and immutable candidate artifact
        if: steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/collect-qualification.py --dependency-root "$(realpath node_modules)" --source "$SOURCE_COMMIT" --out build/release/v1.20.1 --profile manager-discovery-release-v1 --native-source-root "$RUNNER_TEMP/discovery-alpha" --manifest config/manager-discovery-release-v1.json --manifest-sha256 "$(sha256sum config/manager-discovery-release-v1.json | cut -d' ' -f1)" --verifier-sha256 "$(sha256sum scripts/release/discovery-release-profile.py | cut -d' ' -f1)"
      - name: Verify complete published download inventory
        if: steps.readiness.outputs.ready == 'true'
        run: python3 scripts/release/verify-package.py build/release/v1.20.1 --published --profile manager-discovery-release-v1 --native-source-root "$RUNNER_TEMP/discovery-alpha" --manifest config/manager-discovery-release-v1.json --manifest-sha256 "$(sha256sum config/manager-discovery-release-v1.json | cut -d' ' -f1)" --verifier-sha256 "$(sha256sum scripts/release/discovery-release-profile.py | cut -d' ' -f1)"
      - name: Attest exact-source release assembly
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/release/v1.20.1/*
      - name: Verify artifact, repository, workflow and source attestation bindings
        if: steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in build/release/v1.20.1/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-discovery-v1.yml" --signer-digest "$SOURCE_COMMIT" --source-digest "$SOURCE_COMMIT" --source-ref refs/heads/main --deny-self-hosted-runners
          done
      - name: Validate evidence, create draft, verify assets, then publish
        if: steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/publish-release.py --dependency-root "$(realpath node_modules)" --qualification build/release/v1.20.1/QUALIFICATION.json --assets build/release/v1.20.1 --publish --profile manager-discovery-release-v1 --native-source-root "$RUNNER_TEMP/discovery-alpha" --manifest config/manager-discovery-release-v1.json --manifest-sha256 "$(sha256sum config/manager-discovery-release-v1.json | cut -d' ' -f1)" --verifier-sha256 "$(sha256sum scripts/release/discovery-release-profile.py | cut -d' ' -f1)"
