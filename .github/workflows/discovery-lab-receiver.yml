name: Discovery Lab receiver policy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  policy:
    name: Discovery Lab zero-cap receiver policy (${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.21.0']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify qualified source checkout
        env:
          QUALIFICATION_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE"
          printf 'QUALIFIED_SOURCE_COMMIT=%s\n' "$QUALIFICATION_SOURCE"
      - name: Check exact source and run transport-policy regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/discovery-policy"
          git rev-parse HEAD > "$RUNNER_TEMP/discovery-policy/source-commit.txt"
          node --version > "$RUNNER_TEMP/discovery-policy/node-version.txt"
          sha256sum scripts/integrations/discovery-lab-contract.mjs scripts/integrations/discovery-lab-work-request.mjs scripts/integrations/discovery-lab-work-request.test.mjs scripts/integrations/fixtures/discovery-lab-request.json > "$RUNNER_TEMP/discovery-policy/SHA256SUMS.txt"
          sha256sum scripts/integrations/discovery-release-module-closure.mjs scripts/integrations/discovery-release-module-closure.test.mjs >> "$RUNNER_TEMP/discovery-policy/SHA256SUMS.txt"
          node --test --test-reporter=tap scripts/integrations/discovery-lab-work-request.test.mjs > "$RUNNER_TEMP/discovery-policy/policy.tap"
          cat "$RUNNER_TEMP/discovery-policy/policy.tap"
          node --test --test-reporter=tap scripts/integrations/discovery-release-module-closure.test.mjs > "$RUNNER_TEMP/discovery-policy/module-closure.tap"
          cat "$RUNNER_TEMP/discovery-policy/module-closure.tap"
          node --test --test-reporter=tap scripts/integrations/discovery-installed-operator.test.mjs > "$RUNNER_TEMP/discovery-policy/operator-input.tap"
          cat "$RUNNER_TEMP/discovery-policy/operator-input.tap"
      - name: Install the exact compiler dependency closure
        run: |
          npm ci
          npm --prefix hardhat ci
      - name: Capture the exact reviewed Alpha implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: MontrealAI/AGI-Alpha-Agent-v0
          # Exact031b installed-source review6385568620; fresh installed qualification remains required.
          ref: 031bdb5d055c8bad896daa076baea2b5e17b242c
          path: build/discovery-alpha
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate the installed native source from Manager inputs
        run: |
          test ! -e "$RUNNER_TEMP/discovery-alpha"
          mv "$GITHUB_WORKSPACE/build/discovery-alpha" "$RUNNER_TEMP/discovery-alpha"
      - name: Verify the versioned Discovery release source inventory
        run: |
          set -euo pipefail
          python3 scripts/release/test-discovery-release-profile.py > "$RUNNER_TEMP/discovery-policy/source-profile-tests.txt" 2>&1
          cat "$RUNNER_TEMP/discovery-policy/source-profile-tests.txt"
          python3 scripts/release/discovery-release-profile.py \
            --dependency-root "$(realpath node_modules)" \
            --native-source-root "$RUNNER_TEMP/discovery-alpha" \
            --manifest-sha256 "$(sha256sum config/manager-discovery-release-v1.json | cut -d' ' -f1)" \
            --verifier-sha256 "$(sha256sum scripts/release/discovery-release-profile.py | cut -d' ' -f1)" \
            > "$RUNNER_TEMP/discovery-policy/source-profile.json"
          sha256sum config/manager-discovery-release-v1.json config/discovery-release-baseline-v1.json scripts/release/discovery-release-profile.py scripts/release/test-discovery-release-profile.py .github/workflows/discovery-lab-receiver.yml docs/successor/DISCOVERY_LAB.md >> "$RUNNER_TEMP/discovery-policy/SHA256SUMS.txt"
      - name: Run actual pinned synthetic campaign and native admission
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOVERY_MATRIX_NODE: ${{ matrix.node }}
          QUALIFICATION_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/release/discovery-saved-candidate.py --source "$QUALIFICATION_SOURCE" --output "$RUNNER_TEMP/discovery-native"
      - name: Retain exact-source policy and actual local native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: discovery-lab-policy-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/discovery-native
          if-no-files-found: error
      - name: Retain source policy and parser regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: discovery-source-policy-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/discovery-policy
          if-no-files-found: error
