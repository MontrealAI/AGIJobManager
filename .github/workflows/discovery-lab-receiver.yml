name: Discovery Lab receiver policy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy:
    name: Discovery Lab zero-cap receiver policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Check exact source and run transport-policy regressions
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          mkdir -p "$RUNNER_TEMP/discovery-lab"
          git rev-parse HEAD > "$RUNNER_TEMP/discovery-lab/source-commit.txt"
          node --version > "$RUNNER_TEMP/discovery-lab/node-version.txt"
          sha256sum scripts/integrations/discovery-lab-contract.mjs scripts/integrations/discovery-lab-work-request.mjs scripts/integrations/discovery-lab-work-request.test.mjs scripts/integrations/fixtures/discovery-lab-request.json > "$RUNNER_TEMP/discovery-lab/SHA256SUMS.txt"
          node --test --test-reporter=tap scripts/integrations/discovery-lab-work-request.test.mjs > "$RUNNER_TEMP/discovery-lab/policy.tap"
          cat "$RUNNER_TEMP/discovery-lab/policy.tap"
      - name: Retain actual policy evidence (not native lab qualification)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discovery-lab-policy-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/discovery-lab
          if-no-files-found: error

