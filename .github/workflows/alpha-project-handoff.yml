name: Alpha project handoff
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  receiver-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify qualified source checkout
        env:
          QUALIFICATION_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE"
          printf 'QUALIFIED_SOURCE_COMMIT=%s\n' "$QUALIFICATION_SOURCE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Fetch the exact reviewed native Alpha validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: MontrealAI/AGI-Alpha-Agent-v0
          ref: 7c410d3d61d5d6bba5354307e1784dba2b3aa177
          path: build/alpha-source
          persist-credentials: false
      - name: Exercise actual receiver validation, work and bilingual history
        env:
          SUCCESSOR_ALPHA_SOURCE: ${{ github.workspace }}/build/alpha-source
        run: node --test scripts/successor/alpha-project.test.mjs scripts/successor/alpha-project-browser.test.mjs scripts/successor/source-identity.test.mjs scripts/integrations/four-repo-computer-receipt.test.mjs
      - name: Fetch the exact reviewed transformation inspector
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: MontrealAI/AGI-Alpha-Agent-v0
          ref: 272b4de86bdc306ebf547750717983e467f5fcfd
          path: build/alpha-ti-source
          persist-credentials: false
      - name: Validate native transformation campaign boundary
        run: |
          node --test scripts/integrations/transformational-work-request.test.mjs scripts/integrations/transformational-native-source.test.mjs
          node scripts/integrations/transformational-native-test.mjs "$GITHUB_WORKSPACE/build/alpha-ti-source"
