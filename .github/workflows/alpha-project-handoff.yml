name: Alpha project handoff
on:
  pull_request:
    paths:
      - 'scripts/successor/**'
      - 'site/**'
      - 'package.json'
      - 'LICENSE'
      - '.github/workflows/alpha-project-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/successor/**'
      - 'site/**'
      - 'package.json'
      - 'LICENSE'
      - '.github/workflows/alpha-project-handoff.yml'
permissions:
  contents: read
jobs:
  receiver-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Fetch the exact reviewed native Alpha validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: MontrealAI/AGI-Alpha-Agent-v0
          ref: 7c410d3d61d5d6bba5354307e1784dba2b3aa177
          path: build/alpha-source
          persist-credentials: false
      - name: Exercise actual receiver validation, work and bilingual history
        env:
          SUCCESSOR_ALPHA_SOURCE: ${{ github.workspace }}/build/alpha-source
        run: node --test scripts/successor/alpha-project.test.mjs
