name: USDC Release v0.9.0

on:
  pull_request:
    paths:
      - 'docs/releases/v0.9.0/**'
      - 'scripts/release/**'
      - '.github/workflows/current-state-release.yml'
  push:
    branches: [main]
    paths:
      - 'docs/releases/v0.9.0/release.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: current-state-release-v0.9.0
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Test release qualification gates offline
        run: python3 scripts/release/test-release-gates.py
      - name: Verify frozen USDC console
        run: |
          git worktree add --detach /tmp/usdc-release-source ed5369094c6ff277f74b077b3cb26f86afa16a67
          node scripts/release/verify-usdc-ui.mjs /tmp/usdc-release-source
      - name: Verify recorded successful source CI
        run: python3 scripts/release/publish-release.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build and verify reproducible release assets
        run: |
          python3 scripts/release/package-release.py
          python3 scripts/release/package-release.py --out /tmp/usdc-release-rebuild
          diff -r build/release/v0.9.0 /tmp/usdc-release-rebuild

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package the pinned application commit
        run: python3 scripts/release/package-release.py
      - name: Create draft, verify assets, then publish
        run: python3 scripts/release/publish-release.py --publish
        env:
          GH_TOKEN: ${{ github.token }}
