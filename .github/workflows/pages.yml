name: GitHub Pages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the separately reviewed main revision to production Pages'
        type: boolean
        required: true
        default: false
      source_commit:
        description: 'Exact reviewed main commit SHA; required when publish is true'
        type: string
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - 'scripts/successor/**'
      - 'ui/agijobmanager-usdc.html'
      - 'ui/dist-ipfs/agijobmanager.html'
      - 'config/usdc-deployment.json'
      - 'docs/**'
      - 'hardhat/README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - 'scripts/successor/**'
      - 'ui/agijobmanager-usdc.html'
      - 'ui/dist-ipfs/agijobmanager.html'
      - 'config/usdc-deployment.json'
      - 'docs/**'
      - 'hardhat/README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify qualified source checkout
        env:
          QUALIFICATION_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_PAGES_SOURCE: ${{ inputs.source_commit }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE"
          printf 'QUALIFIED_SOURCE_COMMIT=%s\n' "$QUALIFICATION_SOURCE"
          if [ "$PUBLISH_REQUESTED" = true ]; then
            test "$EXPECTED_PAGES_SOURCE" = "$QUALIFICATION_SOURCE"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
      - name: Build and verify static pages
        run: |
          node scripts/site/build.mjs
          node scripts/site/check.mjs
          node --test scripts/site/workflows.test.mjs
          node --check site/assets/app.mjs
          node --check site/assets/employer.mjs
          node --test scripts/site/employer-model.test.mjs
      - name: SUCCESSOR local and adversarial checks
        run: |
          npm run successor:test
          node --test scripts/successor/preservation.test.mjs
      - name: Install browser test dependencies
        run: |
          npm ci
          npm --prefix ui ci --ignore-scripts
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify mobile, desktop and bilingual interactions
        run: |
          node scripts/site/browser-test.mjs
          node scripts/site/employer-browser-test.mjs
      - name: SUCCESSOR browser, accessibility and isolated worker rehearsal
        run: |
          npm run successor:browser
          node scripts/successor/history-browser-test.mjs
          npm run successor:rehearse
      - name: Retain SUCCESSOR checks and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SUCCESSOR-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/successor-browser/
            build/successor-history-browser/
            build/successor-rehearsal/
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages

  deploy:
    name: Publish GitHub Pages
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
