name: UI Pages Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - '.github/workflows/pages.yml'
      - 'hardhat/deployments/mainnet/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      NEXT_PUBLIC_DEMO_MODE: '0'
      NEXT_PUBLIC_CHAIN_ID: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build single-file UI
        run: npm run build:ipfs

      - name: Verify single-file invariant
        run: npm run verify:singlefile

      - name: Publish to gh-pages
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gh-pages-publish
          mkdir -p /tmp/gh-pages-publish
          cp ui/dist-ipfs/index.html /tmp/gh-pages-publish/index.html
          cp ui/dist-ipfs/index.html /tmp/gh-pages-publish/agijobmanager.html

          cd /tmp/gh-pages-publish
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html agijobmanager.html
          git commit -m "Deploy Sovereign Ops Console to GitHub Pages"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
