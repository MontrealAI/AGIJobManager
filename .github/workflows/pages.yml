name: GitHub Pages

on:
  workflow_run:
    workflows: ['Publish reviewed release after final-source qualification']
    types: [completed]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the separately reviewed main revision to production Pages'
        type: boolean
        required: true
        default: false
      source_commit:
        description: 'Exact reviewed main commit SHA; required when publish is true'
        type: string
        required: false
        default: ''
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      automatic_publication: ${{ steps.published_source.outputs.authorized }}
      publication_source: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
    name: Build and check website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify qualified source checkout
        env:
          QUALIFICATION_SOURCE: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          EXPECTED_PAGES_SOURCE: ${{ inputs.source_commit }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE"
          printf 'QUALIFIED_SOURCE_COMMIT=%s\n' "$QUALIFICATION_SOURCE"
          if [ "$PUBLISH_REQUESTED" = true ]; then
            test "$EXPECTED_PAGES_SOURCE" = "$QUALIFICATION_SOURCE"
          fi
      - name: Authenticate published source before automatic Pages publication
        id: published_source
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/pages-publication-maintenance.py --source '${{ github.event.workflow_run.head_sha }}'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
      - name: Build and verify static pages
        run: |
          node scripts/site/build.mjs
          node scripts/site/check.mjs
          node --test scripts/site/deployments.test.mjs
          node --test scripts/site/workflows.test.mjs
          node --test scripts/site/computer-receipt.test.mjs
          node --check site/assets/app.mjs
          node --check site/assets/employer.mjs
          node --test scripts/site/employer-model.test.mjs
      - name: SUCCESSOR local and adversarial checks
        run: |
          npm run successor:test
          node --test scripts/successor/source-identity.test.mjs
          python3 scripts/release/run-maintenance-preservation.py
      - name: Install browser test dependencies
        run: |
          npm ci
          npm --prefix ui ci --ignore-scripts
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify mobile, desktop and bilingual interactions
        run: |
          node scripts/site/browser-test.mjs
          node scripts/site/employer-browser-test.mjs
          node scripts/site/computer-receipt-browser-test.mjs
      - name: SUCCESSOR browser, accessibility and isolated worker rehearsal
        run: |
          npm run successor:browser
          node scripts/successor/alpha-project-browser-test.mjs
          node scripts/successor/history-browser-test.mjs
          npm run successor:rehearse
      - name: Retain SUCCESSOR checks and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SUCCESSOR-evidence-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          path: |
            build/successor-browser/
            build/successor-alpha-browser/
            build/successor-history-browser/
            build/successor-rehearsal/
            build/computer-receipt-browser/
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'workflow_run' && steps.published_source.outputs.authorized == 'true'))
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'workflow_run' && needs.build.outputs.automatic_publication == 'true'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck current main immediately before publishing Pages
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_SOURCE: ${{ needs.build.outputs.publication_source }}
        run: |
          actual=$(gh api repos/MontrealAI/AGIJobManager/git/ref/heads/main --method GET --jq '.object.sha')
          test "$actual" = "$PAGES_SOURCE"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
