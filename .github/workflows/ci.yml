name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify qualified source checkout
        env:
          QUALIFICATION_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$QUALIFICATION_SOURCE"
          printf 'QUALIFIED_SOURCE_COMMIT=%s\n' "$actual"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install contract toolchain
        working-directory: hardhat
        run: npm ci

      - name: Install Playwright Chromium
        if: matrix.shard == 0
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Bytecode size check
        run: npm run size

      - name: Test
        run: npm run test:shard -- ${{ matrix.shard }} 4

      - name: Rehearse the documented local USDC job
        if: matrix.shard == 0
        run: node scripts/local-job-demo.cjs

      - name: USDC console regression checks
        if: matrix.shard == 0
        run: node scripts/ui/verify-usdc-console.mjs

      - name: UI smoke test
        if: matrix.shard == 0
        run: npm run test:ui

      - name: Released USDC console browser checks
        if: matrix.shard == 0
        run: npm run test:ui:usdc
