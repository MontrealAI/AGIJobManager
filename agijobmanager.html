<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: ipfs:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" />
  <meta name="referrer" content="no-referrer" />
  <title>AGIJobManager · Sovereign Ops Console</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    body{margin:0;background:#130a20;color:#f0eaff}header{padding:12px 16px;border-bottom:1px solid #3d3050}
    nav{display:flex;gap:12px;flex-wrap:wrap}a{color:#d9c8ff}main{padding:16px}button,input,textarea{background:#21142f;color:#fff;border:1px solid #4f3e66;border-radius:6px;padding:6px}
    table{width:100%;border-collapse:collapse}th,td{border:1px solid #4f3e66;padding:6px;text-align:left}
  </style>
</head>
<body data-hash-route="/">
<header>
  <h1>AGIJobManager</h1>
  <nav>
    <a data-testid="top-nav-dashboard" href="#/">Dashboard</a>
    <a data-testid="top-nav-jobs" href="#/jobs">Jobs</a>
    <a data-testid="top-nav-identity" href="#/identity">Identity</a>
    <a data-testid="top-nav-admin" href="#/admin">Admin</a>
    <a data-testid="top-nav-advanced" href="#/advanced">Advanced</a>
    <a data-testid="top-nav-design" href="#/design">Design</a>
    <a data-testid="top-nav-deployment" href="#/deployment">Deployment</a>
    <a data-testid="top-nav-demo" href="#/demo">Demo</a>
  </nav>
</header>
<main data-ipfs-main-outlet="true"></main>
<script>(function(){
  const detectGatewayBase = (pathname) => {
    const segments = pathname.split('/').filter(Boolean);
    if (segments[0] === 'ipfs' && segments[1]) return '/ipfs/' + segments[1];
    if (segments[0] === 'ipns' && segments[1]) return '/ipns/' + segments[1];
    return pathname;
  };
  const documentPath = window.location.pathname;
  const documentSearch = window.location.search;
  const documentUrl = documentPath + documentSearch;
  const gatewayBase = detectGatewayBase(documentPath);
  const rawPushState = history.pushState.bind(history);
  const rawReplaceState = history.replaceState.bind(history);
  const OFFICIAL={"version":"0.9.5","status":"deployment-required","chainId":1,"explorerBaseUrl":"https://etherscan.io","baseIpfsUrl":"https://ipfs.io/ipfs/","managerAddress":"","ensJobPagesAddress":"","finalOwner":"","usdc":{"symbol":"USDC","decimals":6,"address":"0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"},"addressSource":"https://developers.circle.com/stablecoins/usdc-contract-addresses","note":"Software release only; no live USDC manager is recorded here. v0.9.5 buyer-protection rules require a fresh manager and eight fixed linked libraries, including JobSettlement and JobValidation. Preserve every existing job on its original manager and namespace. Verify accepted ownership, both recipients, ENS wiring and READINESS_NFT_CONFIG before opening intake. Initial activation requires zero escrow, bonds and pending claims. Later recipient and NFT collection changes require zero live escrow and bonds; old claims retain their beneficiary.","settlementWallets":{"wallet30":"","wallet10":""},"settlement":{"wallet30Percentage":30,"wallet10Percentage":10,"defaultValidatorPercentage":8,"validatorRateSnapshot":"job-posting","agent":"remaining balance"},"nftPolicy":{"defaultRequired":true,"snapshot":"job-posting","collectionChanges":"zero outstanding escrow and bonds","payoutEffect":"none"},"contracts":{"agiJobManager":"","ensJobPages":"","usdcToken":"0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"},"rpcUrls":["https://eth.llamarpc.com","https://ethereum-rpc.publicnode.com"]};
  const SETTINGS_KEY='agijobmanager.runtime.settings.v1';
  const DEFAULT_SETTINGS={rpcUrls:OFFICIAL.rpcUrls,explorerBaseUrl:OFFICIAL.explorerBaseUrl,ipfsGatewayBaseUrl:OFFICIAL.baseIpfsUrl,demoMode:false,agentMode:false,allowInsecureHttpLinks:false};
  const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const toHashRoute=(input)=>{if(typeof input!=='string')return null;if(!input.startsWith('/')||input.startsWith('//'))return null;return '#'+input;};
  const normalizeHashHref = (input) => {
    if (typeof input !== 'string' || !input) return null;
    if (input.startsWith('#/')) return input;
    if (input.startsWith('/')) return toHashRoute(input);
    if (input.startsWith('//')) return null;
    let parsed;
    try {
      parsed = new URL(input, window.location.href);
    } catch (_error) {
      return null;
    }

    if (parsed.origin !== window.location.origin) return null;
    if (parsed.hash && parsed.hash.startsWith('#/')) {
      return parsed.hash;
    }
    return toHashRoute(parsed.pathname + parsed.search);
  };
  const baseRoutes = new Set(['/','/jobs','/identity','/admin','/advanced','/design','/deployment','/demo']);
  const recoverPrefixedRoute = (routePath) => {
    if (typeof routePath !== 'string' || !routePath.startsWith('/')) return null;

    const segments = routePath.split('/').filter(Boolean);
    if (segments.length === 0) return '/';

    const normalizedSegments = [];
    for (const segment of segments) {
      const lower = segment.toLowerCase();
      if (!segment) continue;
      if (lower === 'ipfs' || lower === 'ipns') {
        normalizedSegments.length = 0;
        continue;
      }
      if (lower === 'agijobmanager' || lower === 'index.html' || lower === 'agijobmanager.html') {
        continue;
      }
      if (lower.endsWith('.html')) {
        continue;
      }
      normalizedSegments.push(segment);
    }

    if (normalizedSegments.length === 0) return '/';

    const first = normalizedSegments[0] || '';
    const firstLower = first.toLowerCase();
    if (firstLower === 'jobs') {
      const maybeJobId = normalizedSegments.slice(1).join('/');
      if (!maybeJobId) return '/jobs';
      return '/jobs/' + maybeJobId;
    }

    const candidate = '/' + firstLower;
    if (baseRoutes.has(candidate)) return candidate;
    return null;
  };
  const sanitizeRoutePath = (routePath) => {if(typeof routePath!=='string'||!routePath)return '/';const nestedHashRouteIndex=routePath.lastIndexOf('#/');if(nestedHashRouteIndex>0){const nestedHashRoute=routePath.slice(nestedHashRouteIndex+1);return sanitizeRoutePath(nestedHashRoute);}const routeWithoutHash=routePath.split('#')[0]||'/';const withoutQuery=routeWithoutHash.split('?')[0]||'/';const normalizedSlash=withoutQuery.startsWith('/')?withoutQuery:'/'+withoutQuery;const collapsed=normalizedSlash.replace(/\/{2,}/g,'/');const lowered=collapsed.toLowerCase();if(lowered.includes('agijobmanager.html')||lowered.startsWith('/agijobmanager/')||lowered.startsWith('/ipfs/')||lowered.startsWith('/ipns/')){return recoverPrefixedRoute(collapsed);}if(collapsed.startsWith('/jobs/'))return recoverPrefixedRoute(collapsed);if(baseRoutes.has(collapsed)) return collapsed;return '/';};
  const parseRouteInput = (routeInput) => {
    if (typeof routeInput !== 'string' || !routeInput.startsWith('/')) return null;
    const hashIndex = routeInput.indexOf('#');
    const withoutHash = hashIndex >= 0 ? routeInput.slice(0, hashIndex) : routeInput;
    const queryIndex = withoutHash.indexOf('?');
    const pathname = queryIndex >= 0 ? withoutHash.slice(0, queryIndex) : withoutHash;
    const search = queryIndex >= 0 ? withoutHash.slice(queryIndex) : '';
    return { pathname, search, routeInput: withoutHash };
  };
  const toHashUrl = (routeInput) => {
    const parsedHashRoute = parseRouteInput(routeInput);
    if (!parsedHashRoute) return null;
    return documentUrl + '#' + parsedHashRoute.routeInput;
  };
  const dispatchRouteUpdate = (state) => {
    window.dispatchEvent(new PopStateEvent('popstate', { state }));
  };
  const startupHashLooksLeaky = (rawHash, lowerHash) => {
    if (rawHash.startsWith('#/#/') || rawHash.startsWith('##/')) return true;
    if (lowerHash.includes('agijobmanager.html')) return true;
    if (rawHash.includes(documentPath)) return true;
    if (rawHash.includes(gatewayBase)) return true;
    return false;
  };
  const getStartupCanonicalHash = (rawHash) => {
    if (!rawHash || rawHash === '#') return null;
    const lowerHash = rawHash.toLowerCase();
    const directRouteCandidate = rawHash.startsWith('#/') ? rawHash.slice(1) : '';
    if (directRouteCandidate) { const sanitizedDirectRoute = sanitizeRoutePath(directRouteCandidate); const directCanonicalHash = '#' + sanitizedDirectRoute; if (directCanonicalHash !== rawHash) return directCanonicalHash; return null; }
    if (startupHashLooksLeaky(rawHash, lowerHash)) return '#/';
    return '#/';
  };
  const getRouteFromHash = () => { const rawHash = window.location.hash || ''; if (rawHash === '#' || rawHash === '') return '/'; if (!rawHash.startsWith('#/')) return '/'; const normalized = rawHash.slice(1); return sanitizeRoutePath(normalized.startsWith('/') ? normalized : '/'); };
  const navigateHashRoute = (nextRoute, options = {}) => {
    const mode = options.mode === 'replace' ? 'replace' : 'push';
    if (!nextRoute || !nextRoute.startsWith('/')) return;
    const hashUrl = toHashUrl(nextRoute);
    if (!hashUrl) return;
    if (mode === 'replace') { rawReplaceState(history.state, '', hashUrl); } else { rawPushState(history.state, '', hashUrl); }
    dispatchRouteUpdate(history.state);
  };
  let settings=(()=>{try{return {...DEFAULT_SETTINGS,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch(_error){return {...DEFAULT_SETTINGS}}})();
  const walletState={provider:null,providers:[],providerLabel:'Injected EVM Wallet',account:null,chainId:null,boundProvider:null};
  const ensureHeaderWalletHost=()=>{let host=document.getElementById('wallet-header-panel');if(host)return host;const hdr=document.querySelector('header')||document.body;host=document.createElement('div');host.id='wallet-header-panel';hdr.appendChild(host);return host;};
  const removeStaleWalletHosts=()=>{const panelHost=document.getElementById('wallet-panel');const hosts=[...document.querySelectorAll('#wallet-header-panel')];if(panelHost){hosts.forEach((node)=>node.remove());return;}if(hosts.length<2)return;hosts.slice(1).forEach((node)=>node.remove());};
  const templates={ '/':'<section data-testid="route-dashboard"><h2>Dashboard · Sovereign Ops Console</h2><div id="wallet-panel"></div><p id="rpc-status">Read-only mainnet hydration active.</p><ul><li>Owner: <code id="hyd-owner">loading</code></li><li>Next Job ID: <code id="hyd-next-job-id">loading</code></li><li>Token Symbol: <code id="hyd-token-symbol">loading</code></li><li>Wallet Balance: <code id="hyd-token-balance">-</code></li></ul></section>','/jobs':'<section data-testid="route-jobs"><h2>Jobs Ledger</h2><p id="jobs-status">Loading jobs ledger…</p><table><thead><tr><th>ID</th><th>Status</th><th>Payout</th><th>Employer</th><th>Agent</th><th>ENS Name</th></tr></thead><tbody id="jobs-ledger-body"></tbody></table></section>','/identity':'<section data-testid="route-identity"><h2>Identity Layer Console</h2><li>Wired job manager: <code id="hyd-ens-job-manager">resolving…</code> <button id="identity-retry" type="button">Retry</button></li><li id="identity-wiring-status">Checking ABI-backed wiring state…</li><p>Wiring read failed: bounded timeout and retry available.</p></section>','/admin':'<section data-testid="route-admin"><h2>Admin Ops Console</h2><p>Role gate: <strong id="hyd-owner-match">Not authorized</strong></p><p id="admin-write-guidance">Connect MetaMask on Ethereum Mainnet for write actions. Read-only telemetry is always available.</p><button id="admin-pause" disabled>Pause protocol</button><button id="admin-unpause" disabled>Unpause protocol</button><button id="admin-settlement" disabled>Toggle settlement pause</button><textarea id="settings-rpc" rows="4"></textarea><input id="settings-explorer"/><input id="settings-ipfs"/><input type="checkbox" id="settings-demo"/><input type="checkbox" id="settings-agent"/><input type="checkbox" id="settings-http"/><button id="settings-save">Save</button><button id="settings-reset">Reset official defaults</button><button id="settings-export">Export JSON</button><button id="settings-import">Import JSON</button></section>','/advanced':'<section data-testid="route-advanced"><h2>Advanced Contract Console</h2></section>','/design':'<section data-testid="route-design"><h2>Design System Gallery</h2></section>','/deployment':'<section data-testid="route-deployment"><h2>Deployment Registry</h2></section>','/demo':'<section data-testid="route-demo"><h2>Deterministic Demo Mode</h2></section>'};
  const methodId=(sig)=>({'owner()':'0x8da5cb5b','nextJobId()':'0x15e84af9','symbol()':'0x95d89b41','getJobCore(uint256)':'0x0a0f704e','jobManager()':'0x8f283970','agiJobManager()':'0xdc95d7bf'}[sig]||'0x');
  const pad=(v)=>v.toString(16).padStart(64,'0');const addr=(hex)=>'0x'+hex.slice(-40);
  const rpcCall=async(method,params)=>{let lastErr;for(const url of settings.rpcUrls){try{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});const j=await r.json();if(j.error)throw new Error(j.error.message||'rpc');return j.result;}catch(error){lastErr=error;}}throw lastErr||new Error('rpc unavailable');};
  const ethCall=(to,data)=>rpcCall('eth_call',[{to,data},'latest']);
  const setText=(id,v)=>{const n=document.getElementById(id);if(n)n.textContent=String(v);};
  const hydrateReadOnly=async()=>{if(OFFICIAL.status!=='deployed'){setText('rpc-status','USDC deployment required. No live manager is configured.');setText('hyd-token-symbol','USDC');return;}try{setText('rpc-status','Read-only mainnet hydration active.');setText('hyd-owner',addr(await ethCall(OFFICIAL.contracts.agiJobManager,methodId('owner()'))));setText('hyd-next-job-id',Number(BigInt(await ethCall(OFFICIAL.contracts.agiJobManager,methodId('nextJobId()')))));setText('hyd-token-symbol','USDC');}catch(error){setText('rpc-status','Degraded RPC: '+(error&&error.message?error.message:'unknown'));}};
  const hydrateJobs=async()=>{const body=document.getElementById('jobs-ledger-body');const status=document.getElementById('jobs-status');if(!body||!status)return;body.innerHTML='';if(settings.demoMode){body.innerHTML='<tr><td>245</td><td>Open</td><td>1200</td><td>demo</td><td>-</td><td>job-245.alpha.jobs.agi.eth</td></tr>';status.textContent='Demo mode fixtures enabled.';return;}if(OFFICIAL.status!=='deployed'){status.textContent='USDC deployment required.';return;}try{const next=Number(BigInt(await ethCall(OFFICIAL.contracts.agiJobManager,methodId('nextJobId()'))));for(let id=Math.max(1,next-3);id<next;id++){const raw=await ethCall(OFFICIAL.contracts.agiJobManager,methodId('getJobCore(uint256)')+pad(BigInt(id)));if(raw&&raw!=='0x'){body.insertAdjacentHTML('beforeend','<tr><td>'+id+'</td><td>Live</td><td>0</td><td>-</td><td>-</td><td>job-'+id+'.alpha.jobs.agi.eth</td></tr>');}}status.textContent=body.children.length?'Live jobs loaded.':'No live jobs found.';}catch(error){status.textContent='Failed to fetch jobs: '+(error&&error.message?error.message:'unknown');}};
  const hydrateIdentity=()=>{if(OFFICIAL.status!=='deployed'){setText('identity-wiring-status','USDC deployment required.');return;}const run=async()=>{try{const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout after 8s')),8000));const query=(async()=>{for(const m of ['jobManager()','agiJobManager()']){const raw=await ethCall(OFFICIAL.contracts.ensJobPages,methodId(m));if(raw&&raw.length>=66&&!/^0x0{64}$/i.test(raw))return addr(raw);}throw new Error('Not exposed by ABI');})();setText('hyd-ens-job-manager',await Promise.race([query,timeout]));setText('identity-wiring-status','Resolved wiring at latest block.');}catch(error){setText('hyd-ens-job-manager','unavailable');setText('identity-wiring-status','Wiring read failed: '+(error&&error.message?error.message:'unknown')+' · Retry available.');}};run();const retry=document.getElementById('identity-retry');if(retry)retry.onclick=run;};
  const hydrateAdmin=()=>{const isOwner=OFFICIAL.status==='deployed'&&walletState.account&&walletState.account.toLowerCase()===OFFICIAL.finalOwner.toLowerCase();setText('hyd-owner-match',isOwner?'You are owner':'Not authorized');['admin-pause','admin-unpause','admin-settlement'].forEach((id)=>{const b=document.getElementById(id);if(b)b.disabled=!isOwner;});};
  const saveSettings=()=>{try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}catch(_error){}};
  const wireSettingsPanel=()=>{const rpc=document.getElementById('settings-rpc');const exp=document.getElementById('settings-explorer');const ipfs=document.getElementById('settings-ipfs');const demo=document.getElementById('settings-demo');const agent=document.getElementById('settings-agent');const http=document.getElementById('settings-http');if(!rpc||!exp||!ipfs||!demo||!agent||!http)return;rpc.value=settings.rpcUrls.join('\\n');exp.value=settings.explorerBaseUrl;ipfs.value=settings.ipfsGatewayBaseUrl;demo.checked=!!settings.demoMode;agent.checked=!!settings.agentMode;http.checked=!!settings.allowInsecureHttpLinks;const save=document.getElementById('settings-save');const reset=document.getElementById('settings-reset');const expBtn=document.getElementById('settings-export');const impBtn=document.getElementById('settings-import');if(save)save.onclick=()=>{settings={rpcUrls:String(rpc.value||'').split('\\n').map((v)=>v.trim()).filter(Boolean),explorerBaseUrl:String(exp.value||'').trim()||OFFICIAL.explorerBaseUrl,ipfsGatewayBaseUrl:String(ipfs.value||'').trim()||OFFICIAL.baseIpfsUrl,demoMode:!!demo.checked,agentMode:!!agent.checked,allowInsecureHttpLinks:!!http.checked};saveSettings();hydrateReadOnly();if(getRouteFromHash()==='/jobs')hydrateJobs();};if(reset)reset.onclick=()=>{settings={...DEFAULT_SETTINGS};saveSettings();renderRoute('/admin');};if(expBtn)expBtn.onclick=async()=>{const payload=JSON.stringify(settings,null,2);if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(payload);return;}catch(_error){}}window.prompt('Copy settings JSON',payload);};if(impBtn)impBtn.onclick=()=>{const raw=window.prompt('Paste settings JSON');if(!raw)return;try{const parsed=JSON.parse(raw);settings={...DEFAULT_SETTINGS,...parsed,rpcUrls:Array.isArray(parsed.rpcUrls)&&parsed.rpcUrls.length?parsed.rpcUrls:DEFAULT_SETTINGS.rpcUrls};saveSettings();renderRoute('/admin');}catch(error){window.alert('Invalid settings JSON: '+(error&&error.message?error.message:'unknown'));}};};
  const labelForProvider=(entry)=>{const p=entry.provider||{};const rdns=((entry.info&&entry.info.rdns)||'').toLowerCase();if(p.isMetaMask||rdns.includes('metamask'))return 'MetaMask';if(p.isPhantom||rdns.includes('phantom'))return 'Phantom';return 'Injected EVM Wallet';};
  const renderWalletPanel=()=>{removeStaleWalletHosts();const panelHost=document.getElementById('wallet-panel');const headerHost=panelHost?null:ensureHeaderWalletHost();const host=panelHost||headerHost;const safeProviderLabel = escapeHtml(walletState.providerLabel || 'none detected');const wrongChain=walletState.chainId&&walletState.chainId!=='0x1';host.innerHTML='<p>Provider: '+safeProviderLabel+'</p><p>Account: '+escapeHtml(walletState.account||'not connected')+'</p><button id="wallet-connect">Connect Wallet</button> <button id="wallet-switch" '+(wrongChain?'':'disabled')+'>Switch to Mainnet</button>';const connectBtn=host.querySelector('#wallet-connect');if(connectBtn)connectBtn.addEventListener('click',connectWallet);const switchBtn=host.querySelector('#wallet-switch');if(switchBtn)switchBtn.addEventListener('click',switchMainnet);};
  const bindProviderEvents=(provider)=>{if(!provider||!provider.on||walletState.boundProvider===provider)return;provider.on('accountsChanged',()=>refreshWalletState());provider.on('chainChanged',()=>refreshWalletState(true));walletState.boundProvider=provider;};
  const refreshWalletState=async(chainOnly)=>{if(!walletState.provider){renderWalletPanel();return;}try{walletState.chainId=await walletState.provider.request({method:'eth_chainId'});if(!chainOnly){const accounts=await walletState.provider.request({method:'eth_accounts'});walletState.account=(accounts&&accounts[0])||null;}}catch(error){walletState.chainId=null;if(!chainOnly)walletState.account=null;const reason=error&&error.message?error.message:'wallet unavailable';setText('rpc-status','Wallet RPC unavailable ('+reason+'). Read-only telemetry still active.');}renderWalletPanel();hydrateAdmin();};
  const connectWallet=async()=>{if(!walletState.provider){await detectProviders();bindProviderEvents(walletState.provider);}if(!walletState.provider){setText('rpc-status','No injected wallet detected yet. Read-only mode remains active.');renderWalletPanel();return;}try{await walletState.provider.request({method:'eth_requestAccounts'});}catch(error){setText('rpc-status','Wallet connect cancelled/unavailable: '+(error&&error.message?error.message:'unknown'));}await refreshWalletState();};
  const switchMainnet=async()=>{if(!walletState.provider)return;await walletState.provider.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x1'}]});await refreshWalletState(true);};
  const detectProviders=async()=>{const seen=[];window.addEventListener('eip6963:announceProvider',(ev)=>{if(ev.detail&&ev.detail.provider)seen.push(ev.detail);});window.dispatchEvent(new Event('eip6963:requestProvider'));await new Promise((resolve)=>setTimeout(resolve,30));if(window.ethereum)seen.push({id:'window.ethereum',provider:window.ethereum,info:{name:'Injected',rdns:''}});walletState.providers=seen;const preferred=seen.find((x)=>labelForProvider(x)==='MetaMask')||seen[0];walletState.provider=preferred?preferred.provider:null;walletState.providerLabel=preferred?labelForProvider(preferred):'Injected EVM Wallet';};
  const renderRoute=(routePath)=>{const normalized=routePath.startsWith('/jobs/')?'/jobs':routePath;document.body.setAttribute('data-hash-route',normalized);const main=document.querySelector('main')||document.body;if(routePath.startsWith('/jobs/')){main.innerHTML='<section data-testid="route-job-detail"><h2>Job Detail</h2></section>';}else{main.innerHTML=templates[normalized]||templates['/'];}wireSettingsPanel();renderWalletPanel();if(normalized==='/jobs')hydrateJobs();if(normalized==='/identity')hydrateIdentity();if(normalized==='/admin')hydrateAdmin();};
  const startupCanonicalHash = getStartupCanonicalHash(window.location.hash || '');
  if (startupCanonicalHash) { rawReplaceState(history.state, '', documentUrl + startupCanonicalHash); }
  window.addEventListener('hashchange', () => {
    const routePath = getRouteFromHash();
    const canonicalHash = '#' + routePath;
    if (window.location.hash !== canonicalHash) { rawReplaceState(history.state, '', documentUrl + canonicalHash); }
    renderRoute(routePath);
  });
  document.addEventListener('click', (event) => {
    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const target = event.target instanceof Element ? event.target.closest('a[href]') : null;
    if (!target || target.hasAttribute('download')) return;
    const targetAttr = (target.getAttribute('target') || '').toLowerCase();
    if (targetAttr && targetAttr !== '_self') return;
    const href = target.getAttribute('href') || '';
    const hashRoute = normalizeHashHref(href);
    if (!hashRoute) return;
    event.preventDefault();
    const routePath = sanitizeRoutePath(hashRoute.slice(1));
    navigateHashRoute(routePath, { mode: 'push' });
    renderRoute(routePath);
  }, true);
  const startupRoute = getRouteFromHash();
  renderRoute(startupRoute);

",\n    \"type\": \"function\"\n  }\n] as const;\n","src/abis/erc20.ts":"export const erc20Abi = [\n  {\"type\":\"function\",\"name\":\"balanceOf\",\"stateMutability\":\"view\",\"inputs\":[{\"type\":\"address\"}],\"outputs\":[{\"type\":\"uint256\"}]},\n  {\"type\":\"function\",\"name\":\"allowance\",\"stateMutability\":\"view\",\"inputs\":[{\"type\":\"address\"},{\"type\":\"address\"}],\"outputs\":[{\"type\":\"uint256\"}]},\n  {\"type\":\"function\",\"name\":\"approve\",\"stateMutability\":\"nonpayable\",\"inputs\":[{\"type\":\"address\"},{\"type\":\"uint256\"}],\"outputs\":[{\"type\":\"bool\"}]},\n  {\"type\":\"function\",\"name\":\"decimals\",\"stateMutability\":\"view\",\"inputs\":[],\"outputs\":[{\"type\":\"uint8\"}]},\n  {\"type\":\"function\",\"name\":\"symbol\",\"stateMutability\":\"view\",\"inputs\":[],\"outputs\":[{\"type\":\"string\"}]}\n] as const;\n","src/app/admin/page.tsx":"'use client';\nimport { useAccount } from 'wagmi';\nimport { useState } from 'react';\nimport { usePlatformSummary } from '@/lib/web3/queries';\nimport { Card } from '@/components/ui/card';\nimport { useDemoRoleFlags, useDemoScenario, isDemoMode } from '@/lib/demo';\n\nconst confirms = ['PAUSE', 'SETTLEMENT', 'LOCK', 'WITHDRAW'] as const;\n\nexport default function Admin() {\n  const { address } = useAccount();\n  const scenario = useDemoScenario();\n  const { data } = usePlatformSummary(scenario);\n  const [typed, setTyped] = useState('');\n  const { actor, isOwner } = useDemoRoleFlags();\n  const owner = data?.owner?.toLowerCase();\n  const demoOwner = isDemoMode && isOwner;\n  const controls = <Card><h2 className='font-serif'>v0.9.4 owner controls</h2><p>Use the USDC console to set the NFT requirement for future jobs, update payout wallets, propose an owner or accept ownership. Wallet changes require paused intake and no reserved escrow. NFT collection changes require all escrow and bonds to be cleared. Existing jobs keep their NFT policy. A proposed owner can accept directly from the console.</p><p className='mt-2'><a className='underline' href='https://github.com/MontrealAI/AGIJobManager/releases/download/v0.9.4/agijobmanager-usdc.html'>Download the USDC console</a> · <a className='underline' href='https://github.com/MontrealAI/AGIJobManager/blob/v0.9.4/docs/OWNER_CONTROLS.md' target='_blank' rel='noopener noreferrer'>Owner guide</a></p></Card>;\n  if ((!address || !owner || address.toLowerCase() !== owner) && !demoOwner) return <div className='container-shell py-8 space-y-3'>{controls}<Card>Connect the current owner wallet to view this dashboard.</Card></div>;\n  return <div className='container-shell py-8 space-y-3'>\n    {controls}\n    {isDemoMode && <Card className='text-sm'>Demo actor: <strong>{actor}</strong>. Owner-only console unlocked only for actor=owner.</Card>}\n    <Card><h2 className='font-serif'>Safety toggles</h2><p>Pause/unpause and settlement pause with simulation-first writes.</p></Card>\n    <Card><h2 className='font-serif'>Roles</h2><p>Manage moderators and allowlists / blacklists.</p></Card>\n    <Card><h2 className='font-serif'>Parameters & identity</h2><p>Thresholds, review periods, ENS wiring and lockIdentityConfiguration.</p></Card>\n    <Card><h2 className='font-serif'>Treasury</h2><p>Withdraw requires paused && !settlementPaused.</p><input className='input-shell mt-2' placeholder='Type PAUSE / SETTLEMENT / LOCK / WITHDRAW' value={typed} onChange={(e) => setTyped(e.target.value)} /><p className='text-xs mt-2'>Valid tokens: {confirms.join(', ')}. {confirms.includes(typed as any) ? 'Confirmed token recognized.' : 'No dangerous action armed.'}</p></Card>\n  </div>;\n}\n","src/app/advanced/page.tsx":"'use client';\n\nimport { verifyUSDCDeployment } from '@/lib/usdc';\nimport { CHAIN_ID } from '@/lib/constants';\nimport { useMemo, useRef, useState } from 'react';\nimport type { AbiFunction } from 'viem';\nimport { Card } from '@/components/ui/card';\nimport { agiJobManagerAbi } from '@/abis/agiJobManager';\nimport { publicClient } from '@/lib/web3/publicClient';\nimport { decodeError } from '@/lib/web3/errors';\nimport { useAccount, useWalletClient } from 'wagmi';\nimport { CONTRACT_ADDRESS, EXPLORER } from '@/lib/constants';\n\ntype CallState = {\n  phase: 'idle' | 'prepare' | 'simulate' | 'sign' | 'pending' | 'confirmed' | 'failed';\n  result?: string;\n  error?: string;\n  txHash?: `0x${string}`;\n};\n\nconst fnAbi = agiJobManagerAbi.filter((entry) => entry.type === 'function') as readonly AbiFunction[];\n\nfunction stringify(value: unknown) {\n  return JSON.stringify(value, (_, v) => (typeof v === 'bigint' ? v.toString() : v), 2);\n}\n\nfunction parseArgs(raw: string): unknown[] {\n  const trimmed = raw.trim();\n  if (!trimmed) return [];\n  const parsed = JSON.parse(trimmed) as unknown;\n  if (!Array.isArray(parsed)) throw new Error('Arguments must be a JSON array.');\n  return parsed;\n}\n\nexport default function AdvancedPage() {\n  const { address } = useAccount();\n  const { data: walletClient } = useWalletClient();\n  const [inputs, setInputs] = useState<Record<string, string>>({});\n  const [states, setStates] = useState<Record<string, CallState>>({});\n  const inFlightWritesRef = useRef<Set<string>>(new Set());\n\n  const functions = useMemo(() => fnAbi, []);\n\n  const updateState = (key: string, next: Partial<CallState>) => {\n    setStates((prev) => ({ ...prev, [key]: { ...prev[key], phase: next.phase ?? prev[key]?.phase ?? 'idle', ...next } }));\n  };\n\n  const runRead = async (fn: AbiFunction) => {\n    const key = `${fn.name}-read`;\n    try {\n      updateState(key, { phase: 'prepare', error: undefined });\n      const args = parseArgs(inputs[key] || '[]');\n      updateState(key, { phase: 'pending' });\n      const value = await (publicClient as any).readContract({\n        address: CONTRACT_ADDRESS,\n        abi: agiJobManagerAbi,\n        functionName: fn.name,\n        args\n      });\n      updateState(key, { phase: 'confirmed', result: stringify(value) });\n    } catch (error) {\n      const decoded = decodeError(error);\n      updateState(key, { phase: 'failed', error: `${decoded.name}: ${decoded.human}` });\n    }\n  };\n\n  const runWrite = async (fn: AbiFunction) => {\n    const key = `${fn.name}-write`;\n    if (inFlightWritesRef.current.has(key)) return;\n    inFlightWritesRef.current.add(key);\n    try {\n      updateState(key, { phase: 'prepare', error: undefined, txHash: undefined });\n      const args = parseArgs(inputs[key] || '[]');\n      const account = address ?? walletClient?.account.address;\n      if (!account || !walletClient) {\n        throw new Error('Wallet required for simulations and writes.');\n      }\n      updateState(key, { phase: 'simulate' });\n      const simulation = await (publicClient as any).simulateContract({\n        address: CONTRACT_ADDRESS,\n        abi: agiJobManagerAbi,\n        functionName: fn.name,\n        args,\n        account\n      });\n      updateState(key, { phase: 'sign', result: stringify(simulation.request) });\n      if(await walletClient.getChainId() !== CHAIN_ID) throw new Error('Wallet network mismatch.');\n      await verifyUSDCDeployment(publicClient, CONTRACT_ADDRESS, CHAIN_ID);\n      const txHash = await (walletClient as any).writeContract(simulation.request as any);\n      updateState(key, { phase: 'pending', txHash });\n      await publicClient.waitForTransactionReceipt({ hash: txHash });\n      updateState(key, { phase: 'confirmed' });\n    } catch (error) {\n      const decoded = decodeError(error);\n      updateState(key, { phase: 'failed', error: `${decoded.name}: ${decoded.human}` });\n    } finally {\n      inFlightWritesRef.current.delete(key);\n    }\n  };\n\n  return (\n    <div className=\"container-shell py-8 space-y-4\" data-testid=\"advanced-console\">\n      <Card>\n        <h1 className=\"text-3xl font-serif\">Advanced Contract Console</h1>\n        <p className=\"text-sm text-muted-foreground mt-2\">Full ABI surface with simulation-first writes. Provide arguments as JSON array.</p>\n      </Card>\n      {functions.map((fn) => {\n        const isRead = fn.stateMutability === 'view' || fn.stateMutability === 'pure';\n        const key = `${fn.name}-${isRead ? 'read' : 'write'}`;\n        const state = states[key];\n        return (\n          <Card key={key} data-testid={`advanced-function-${fn.name}`}>\n            <div className=\"flex items-center justify-between gap-3\">\n              <h2 className=\"font-semibold\">{fn.name}</h2>\n              <span className=\"text-xs text-muted-foreground\">{fn.stateMutability}</span>\n            </div>\n            <p className=\"text-xs mt-1 text-muted-foreground\">inputs: {fn.inputs.map((input) => `${input.name || '_'}:${input.type}`).join(', ') || 'none'}</p>\n            <textarea\n              className=\"mt-3 w-full min-h-20 rounded border border-border bg-background p-2 text-xs font-mono\"\n              value={inputs[key] || '[]'}\n              onChange={(event) => setInputs((prev) => ({ ...prev, [key]: event.target.value }))}\n              aria-label={`${fn.name} args`}\n            />\n            <div className=\"mt-3 flex items-center gap-3\">\n              <button\n                className=\"rounded border border-border px-3 py-1 text-sm disabled:cursor-not-allowed disabled:opacity-60\"\n                onClick={() => (isRead ? runRead(fn) : runWrite(fn))}\n                data-testid={`advanced-run-${fn.name}`}\n                disabled={state?.phase === 'prepare' || state?.phase === 'simulate' || state?.phase === 'sign' || state?.phase === 'pending'}\n              >\n                {state?.phase === 'prepare' || state?.phase === 'simulate' || state?.phase === 'sign' || state?.phase === 'pending'\n                  ? 'In progress…'\n                  : isRead\n                    ? 'Run read'\n                    : 'Simulate → Sign'}\n              </button>\n              <span className=\"text-xs text-muted-foreground\">Phase: {state?.phase ?? 'idle'}</span>\n              {state?.txHash && <a href={`${EXPLORER}/tx/${state.txHash}`} target=\"_blank\" rel=\"noreferrer\" className=\"text-xs underline\">Explorer</a>}\n            </div>\n            {state?.result && <pre className=\"mt-3 overflow-x-auto text-xs\">{state.result}</pre>}\n            {state?.error && <p className=\"mt-3 text-sm text-red-400\">{state.error}</p>}\n          </Card>\n        );\n      })}\n    </div>\n  );\n}\n","src/app/api/merkle/route.ts":"import { NextRequest, NextResponse } from 'next/server';\n\nexport async function GET(req: NextRequest){\n  const kind = req.nextUrl.searchParams.get('kind');\n  const address = req.nextUrl.searchParams.get('address');\n  if (!kind || !address) return NextResponse.json({ error: 'kind and address are required' }, { status: 400 });\n  if (!process.env.MERKLE_PROOF_SERVICE_URL) return NextResponse.json({ error: 'Proof service not configured. Paste proof manually.' }, { status: 501 });\n  return NextResponse.json({ kind, address, proof: [] });\n}\n","src/app/demo/page.tsx":"import Link from 'next/link';\nimport { demoScenarios } from '@/demo/fixtures/scenarios';\n\nexport default function DemoPage() {\n  return <div className='container-shell py-8 space-y-4'>\n    <h1 className='font-serif text-4xl'>Demo scenario gallery</h1>\n    <table className='w-full text-sm card-shell'><thead><tr><th>Name</th><th>Paused</th><th>Settlement paused</th><th>Degraded</th><th>Open</th></tr></thead>\n      <tbody>{demoScenarios.map((s)=><tr key={s.key} className='border-t border-border'><td>{s.title}</td><td>{String(s.paused)}</td><td>{String(s.settlementPaused)}</td><td>{String(s.degradedRpc)}</td><td><Link className='underline' href={`/?scenario=${s.key}`}>Launch</Link></td></tr>)}</tbody>\n    </table>\n  </div>;\n}\n","src/app/deployment/page.tsx":"import { OFFICIAL_DEPLOYMENTS as d } from '@/generated/deployments';\nexport default function DeploymentPage() {\n  return <main className='container-shell space-y-6 py-10'>\n    <h1 className='text-3xl font-semibold'>USDC Deployment Registry</h1>\n    <p>AGIJobManager v{d.version}: {d.status}.</p><p>{d.note}</p>\n    <dl className='space-y-3 break-all'>\n      <dt>Chain ID</dt><dd>{d.chainId}</dd>\n      <dt>Manager</dt><dd>{d.managerAddress || 'Not deployed'}</dd>\n      <dt>Settlement token</dt><dd>USDC ({d.usdc.decimals} decimals): {d.usdc.address}</dd>\n      <dt>30% settlement wallet</dt><dd>{d.settlementWallets.wallet30 || 'Required at deployment'}</dd>\n      <dt>10% settlement wallet</dt><dd>{d.settlementWallets.wallet10 || 'Required at deployment'}</dd>\n      <dt>Successful job distribution</dt><dd>Validators first (8% default), then 30% and 10% of the original USDC job cost, then the remaining balance to the agent.</dd>\n      <dt>Owner maintenance</dt><dd>Payout wallets can change only while intake is paused and all escrow is settled. A new owner must accept an ownership proposal.</dd>\n      <dt>ENS job pages</dt><dd>{d.ensJobPagesAddress || 'Not configured'}</dd>\n    </dl>\n    <a href={d.addressSource} target='_blank' rel='noopener noreferrer'>Circle USDC address reference</a>\n  </main>;\n}\n","src/app/design/page.tsx":"const tokens = ['--background','--foreground','--primary','--accent','--muted','--destructive'];\n\nexport default function DesignPage() {\n  return <div className='container-shell py-8 space-y-4'>\n    <h1 className='font-serif text-4xl'>Design System Gallery</h1>\n    <section className='card-shell'><h2 className='font-serif text-2xl'>Typography</h2><table className='w-full text-sm mt-2'><tbody><tr><td>Display</td><td className='text-5xl font-serif'>Sovereign</td></tr><tr><td>Heading</td><td className='text-3xl font-serif'>Institutional heading</td></tr><tr><td>Body</td><td className='text-base'>Operational copy with tabular numerals 123456.</td></tr></tbody></table></section>\n    <section className='card-shell'><h2 className='font-serif text-2xl'>Color tokens</h2><div className='grid grid-cols-2 md:grid-cols-3 gap-3 mt-2'>{tokens.map((t)=><div key={t} className='rounded border p-3'><div className='h-10 rounded' style={{background:`hsl(var(${t}))`}}/><p className='text-xs mt-2'>{t}</p></div>)}</div></section>\n    <section className='card-shell'><h2 className='font-serif text-2xl'>Components</h2><div className='flex gap-2 flex-wrap mt-2'><button className='btn-primary'>Primary</button><button className='btn-outline'>Outline</button><span className='pill'>Status badge</span><input className='input-shell max-w-xs' placeholder='Input field' /></div></section>\n  </div>;\n}\n","src/app/globals.css":"@tailwind base;\n@tailwind components;\n@tailwind utilities;\n\n:root {\n  --radius: 14px;\n  --background: 270 60% 98%;\n  --foreground: 272 40% 13%;\n  --card: 0 0% 100%;\n  --card-foreground: 272 40% 13%;\n  --popover: 0 0% 100%;\n  --popover-foreground: 272 40% 13%;\n  --primary: 265 64% 32%;\n  --primary-foreground: 0 0% 100%;\n  --secondary: 269 65% 93%;\n  --secondary-foreground: 272 40% 13%;\n  --muted: 270 26% 94%;\n  --muted-foreground: 240 9% 45%;\n  --accent: 261 87% 60%;\n  --accent-foreground: 0 0% 100%;\n  --destructive: 353 73% 59%;\n  --destructive-foreground: 0 0% 100%;\n  --border: 240 6% 90%;\n  --input: 240 6% 90%;\n  --ring: 261 87% 60%;\n}\n\n.dark {\n  --background: 274 100% 6%;\n  --foreground: 270 36% 94%;\n  --card: 271 58% 11%;\n  --card-foreground: 270 36% 94%;\n  --popover: 271 58% 11%;\n  --popover-foreground: 270 36% 94%;\n  --primary: 265 64% 32%;\n  --primary-foreground: 0 0% 100%;\n  --secondary: 268 40% 18%;\n  --secondary-foreground: 270 36% 94%;\n  --muted: 268 38% 17%;\n  --muted-foreground: 240 12% 72%;\n  --accent: 261 87% 60%;\n  --accent-foreground: 0 0% 100%;\n  --destructive: 353 73% 59%;\n  --destructive-foreground: 0 0% 100%;\n  --border: 268 26% 27%;\n  --input: 268 26% 27%;\n  --ring: 261 87% 60%;\n}\n\n@layer base {\n  * { @apply border-border; }\n  body {\n    @apply bg-background text-foreground;\n    font-feature-settings: \"tnum\" 1;\n    background-image: radial-gradient(circle at 20% -10%, hsl(265 64% 32% / 0.18), transparent 55%);\n  }\n  h1, h2, h3 { font-family: var(--font-serif); }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n\n@layer components {\n  .container-shell { @apply mx-auto max-w-7xl px-4 md:px-8; }\n  .hero { @apply rounded-[18px] border bg-card/95 p-8 shadow-sm; }\n  .card-shell { @apply rounded-[14px] border bg-card p-5 shadow-sm; }\n  .input-shell { @apply w-full rounded-[10px] border bg-background px-3 py-2 text-sm; }\n  .btn-primary { @apply rounded-[10px] bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition hover:bg-accent disabled:opacity-50; }\n  .btn-outline { @apply rounded-[10px] border bg-transparent px-4 py-2 text-sm font-medium transition hover:bg-muted; }\n  .pill { @apply inline-flex items-center gap-1 rounded-full border px-3 py-1 text-xs; }\n}\n","src/app/identity/page.tsx":"import { OFFICIAL_DEPLOYMENTS as d } from '@/generated/deployments';\nexport default function IdentityPage() {\n  return <main className='container-shell space-y-6 py-10'>\n    <h1 className='text-3xl font-semibold'>ENS Identity</h1>\n    <p>AGI Agents use a subname under agent.agi.eth; AGI Club validators use a subname under club.agi.eth. The alpha.agent.agi.eth and alpha.club.agi.eth routes remain supported.</p>\n    <p>USDC changes settlement, while membership authorization keeps the legacy ENS, owner allowlist, and Merkle-proof routes. Agents also need an enabled NFT credential when their job requires one. The owner’s default is recorded for each new job; turning it off leaves ENS authorization, bonds and payments unchanged.</p>\n    <p>ENS job pages name individual jobs. Their optional configuration does not replace member identity checks.</p>\n    <p>ENS job pages: {d.ensJobPagesAddress || 'Deployment and manager wiring required for v0.9.4.'}</p>\n    <p>{d.note}</p>\n  </main>;\n}\n","src/app/jobs/[jobId]/page.tsx":"'use client';\nimport { useMemo } from 'react';\nimport { useParams } from 'next/navigation';\nimport { Card } from '@/components/ui/card';\nimport { computeDeadlines, deriveStatus, getActionGate } from '@/lib/jobStatus';\nimport { fmtTime, fmtToken } from '@/lib/format';\nimport { sanitizeUri } from '@/lib/web3/safeUri';\nimport { Button } from '@/components/ui/button';\nimport { useJobs, usePlatformSummary } from '@/lib/web3/queries';\nimport { isDemoMode, useDemoRoleFlags, useDemoScenario } from '@/lib/demo';\n\nconst roleFromActor: Record<string, 'Employer' | 'Agent' | 'Validator' | 'Moderator' | 'Owner'> = {\n  employer: 'Employer',\n  agent: 'Agent',\n  validator: 'Validator',\n  moderator: 'Moderator',\n  owner: 'Owner'\n};\n\nexport default function JobDetail() {\n  const params = useParams();\n  const jobId = Number(params.jobId);\n  const scenario = useDemoScenario();\n  const { actor } = useDemoRoleFlags();\n  const { data: jobs } = useJobs(scenario);\n  const { data: p } = usePlatformSummary(scenario);\n  const j: any = (jobs ?? []).find((x: any) => x?.id === jobId);\n  const status = j\n    ? deriveStatus(\n        { assignedAgent: j.agent, assignedAt: j.assignedAt, duration: j.duration, completed: j.completed, disputed: j.disputed, expired: j.expired },\n        { completionRequested: j.completionRequested, completionRequestedAt: j.completionRequestedAt, disputedAt: j.disputedAt }\n      )\n    : null;\n  const actions = useMemo(\n    () =>\n      status\n        ? {\n            Employer: getActionGate(status.status, 'Employer'),\n            Agent: getActionGate(status.status, 'Agent'),\n            Validator: getActionGate(status.status, 'Validator'),\n            Moderator: getActionGate(status.status, 'Moderator'),\n            Owner: getActionGate(status.status, 'Owner')\n          }\n        : { Employer: {}, Agent: {}, Validator: {}, Moderator: {}, Owner: {} },\n    [status]\n  );\n\n  if (!j || !p || !status) return <div className=\"container-shell py-8\">Loading...</div>;\n\n  const estimate = computeDeadlines(\n    { assignedAgent: j.agent, assignedAt: j.assignedAt, duration: j.duration, completed: j.completed, disputed: j.disputed, expired: j.expired },\n    { completionRequested: j.completionRequested, completionRequestedAt: j.completionRequestedAt, disputedAt: j.disputedAt },\n    { completionReviewPeriod: p.completionReviewPeriod, disputeReviewPeriod: p.disputeReviewPeriod }\n  );\n  const d = isDemoMode ? estimate : j.deadlines ? {\n    expiryTime: j.deadlines[0], completionReviewEnd: j.deadlines[1], disputeReviewEnd: j.deadlines[3]\n  } : null;\n  const safeSpec = sanitizeUri(j.specUri);\n  const activeRole = roleFromActor[actor];\n  const actorActions = activeRole ? Object.entries(actions[activeRole]).filter(([, v]) => v).map(([k]) => k) : [];\n\n  return (\n    <div className=\"container-shell py-8 space-y-4\">\n      <Card>\n        <h1 className=\"font-serif text-2xl\">Job #{String(jobId)} · {status.status}</h1>\n        <p>Payout {fmtToken(j.payout)}</p>\n        {!d ? <p>Deadlines unavailable. Refresh before acting.</p> : p.settlementPaused ? <p>Settlement is paused. Deadlines extend until settlement resumes.</p> : <>\n          <p>Submission deadline {fmtTime(d.expiryTime)}</p>\n          <p>Validator review end {fmtTime(d.completionReviewEnd)}</p>\n          <p>Owner arbitration available after {fmtTime(d.disputeReviewEnd)}</p>\n          {!isDemoMode && <><p>Payment possible after / dispute by {fmtTime(j.deadlines[2])}</p><p>Neutral refund available after {fmtTime(j.deadlines[4])}</p></>}\n        </>}\n        {isDemoMode && <p>Demo deadlines are illustrative estimates.</p>}\n        <p>No votes open a dispute; they do not approve payment. Buyers may explicitly accept satisfactory work. A buyer-win decision returns the full job escrow.</p>\n      </Card>\n      <Card>\n        <h2 className=\"font-serif\">URIs (untrusted)</h2>\n        <p className=\"break-all text-xs\">{j.specUri}</p>\n        <div className=\"flex gap-2\">\n          <Button variant=\"outline\" onClick={() => navigator.clipboard.writeText(j.specUri)}>\n            Copy\n          </Button>\n          <a aria-disabled={!safeSpec.safe} className={`text-sm underline ${safeSpec.safe ? '' : 'pointer-events-none opacity-50'}`} href={safeSpec.href} target=\"_blank\" rel=\"noreferrer\">\n            Open link\n          </a>\n        </div>\n      </Card>\n      <Card>\n        <h2 className=\"font-serif\">Sovereign ledger timeline</h2>\n        <ul className=\"text-sm list-disc pl-6\">\n          <li>JobCreated</li><li>JobApplied</li><li>JobCompletionRequested</li><li>JobValidated / JobDisapproved</li><li>JobDisputed</li><li>DisputeResolvedWithCode</li><li>JobCompleted / JobCancelled / JobExpired</li><li>NFTIssued</li>\n        </ul>\n      </Card>\n      <Card>\n        <h2 className=\"font-serif\">Actions by role</h2>\n        <p>These are possible actions for this status. Deadlines, pauses, identity checks and conflicts must also pass before a transaction can succeed.</p>\n        {isDemoMode ? <p className='text-sm'>Demo actor <strong>{actor}</strong>: {actorActions.join(', ') || 'No actions'}.</p> : null}\n        {Object.entries(actions).map(([role, g]) => (\n          <p key={role} className=\"text-sm\">{role}: {Object.entries(g).filter(([, v]) => v).map(([k]) => k).join(', ') || 'No actions'}</p>\n        ))}\n      </Card>\n      {isDemoMode && <Card>Demo mode: writes disabled.</Card>}\n    </div>\n  );\n}\n","src/app/jobs/page.tsx":"'use client';\nimport Link from 'next/link';\nimport { Card } from '@/components/ui/card';\nimport { useMemo, useState } from 'react';\nimport { deriveStatus } from '@/lib/jobStatus';\nimport { fmtAddr, fmtToken } from '@/lib/format';\nimport { useJobs } from '@/lib/web3/queries';\nimport { isDemoMode, useDemoScenario } from '@/lib/demo';\n\nfunction toCsv(rows: any[]) {\n  return ['jobId,status,payout,employer,agent', ...rows.map((j) => `${j.id},${j.status},${j.payout},${j.employer},${j.agent}`)].join('\\n');\n}\n\nexport default function Jobs() {\n  const scenario = useDemoScenario();\n  const { data } = useJobs(scenario);\n  const [q, setQ] = useState('');\n  const rows = useMemo(() => (data ?? []).map((j: any) => ({ ...j, status: deriveStatus({ assignedAgent: j.agent, assignedAt: j.assignedAt, duration: j.duration, completed: j.completed, disputed: j.disputed, expired: j.expired }, { completionRequested: j.completionRequested, completionRequestedAt: j.completionRequestedAt, disputedAt: j.disputedAt }).status })), [data]);\n  const filtered = rows.filter((r: any) => [String(r.id), r.employer, r.agent, r.status].some((v) => v.toLowerCase().includes(q.toLowerCase())));\n  const csv = toCsv(filtered);\n\n  return <div className='container-shell py-8 space-y-4'>\n    <Card><div className='flex flex-wrap gap-2 items-center justify-between'><input aria-label='Search jobs' className='input-shell max-w-sm' placeholder='Filter by id/address/status' value={q} onChange={(e)=>setQ(e.target.value)} /><button className='btn-outline' onClick={() => navigator.clipboard.writeText(csv)}>Copy CSV export</button></div></Card>\n    {isDemoMode && <Card className='text-sm'>Scenario: {scenario.title}</Card>}\n    <Card>\n      <table className='w-full text-sm'><thead><tr><th>Job ID</th><th>Status</th><th>Payout</th><th>Employer</th><th>Agent</th></tr></thead>\n      <tbody>{filtered.map((j:any)=><tr key={j.id} className='border-t border-border hover:bg-muted/30'><td><Link href={`/jobs/${j.id}`}>{j.id}</Link></td><td>{j.status}</td><td>{fmtToken(j.payout)}</td><td>{fmtAddr(j.employer)}</td><td>{fmtAddr(j.agent)}</td></tr>)}</tbody></table>\n    </Card>\n    <pre data-testid='csv-output' className='card-shell overflow-x-auto text-xs'>{csv}</pre>\n  </div>;\n}\n","src/app/layout.tsx":"import type { Metadata } from 'next';\nimport { headers } from 'next/headers';\nimport '@/styles/globals.css';\nimport { Providers } from '@/components/providers';\nimport { Nav } from '@/components/layout/nav';\nimport { Footer } from '@/components/layout/footer';\n\nexport const metadata: Metadata = { title: 'AGIJobManager UI', description: 'Institutional sovereign ops console for AGIJobManager.' };\n\nexport default async function RootLayout({ children }: { children: React.ReactNode }) {\n  // Request headers keep pages dynamic so every response receives a fresh nonce.\n  const nonce = (await headers()).get('x-nonce') ?? undefined;\n  return <html lang='en' className='dark' suppressHydrationWarning><body><Providers nonce={nonce}><Nav /><main className='hero-aura min-h-[calc(100vh-8rem)]'>{children}</main><Footer /></Providers><\\/body><\\/html>;\n}\n","src/app/page.tsx":"'use client';\nimport Link from 'next/link';\nimport { Card } from '@/components/ui/card';\nimport { usePlatformSummary } from '@/lib/web3/queries';\nimport { isDemoMode, useDemoRoleFlags, useDemoScenario } from '@/lib/demo';\n\nexport default function Page() {\n  const scenario = useDemoScenario();\n  const { actor } = useDemoRoleFlags();\n  const { data, isError, refetch } = usePlatformSummary(scenario);\n  const degraded = isDemoMode ? scenario.degradedRpc : isError;\n\n  return (\n    <div className=\"container-shell py-8 space-y-4\">\n      <section className=\"hero border border-border bg-card/80\">\n        <h1 className=\"text-5xl font-serif\">AGIJobManager · Sovereign Ops Console</h1>\n        <p className=\"text-muted-foreground mt-2\">Institutional dApp for escrow lifecycle, dispute governance, and safety-first operations.</p>\n      </section>\n      {isDemoMode && <Card>Demo mode enabled: writes disabled. Active demo actor: <strong>{actor}</strong>.</Card>}\n      {degraded && <Card className=\"border-destructive\">Degraded RPC. <button onClick={() => refetch()}>Retry</button></Card>}\n      {data?.paused && <Card>Protocol paused.</Card>}\n      {data?.settlementPaused && <Card>Settlement paused.</Card>}\n      <section className=\"grid grid-cols-1 md:grid-cols-3 gap-4\">\n        <Card><h3 className=\"font-serif text-lg\">Create Job</h3><p className=\"text-sm text-muted-foreground\">Wallet required. Simulation-first.</p></Card>\n        <Card><h3 className=\"font-serif text-lg\">Browse Jobs</h3><p className=\"text-sm\">{String(data?.nextJobId ?? 0n)} total ids observed</p><Link className=\"underline\" href=\"/jobs\">Open jobs ledger</Link></Card>\n        <Card><h3 className=\"font-serif text-lg\">Platform Config</h3><p className=\"text-xs\">Quorum {String(data?.voteQuorum ?? 0n)} · approvals {String(data?.requiredValidatorApprovals ?? 0n)}</p><Link className=\"underline\" href=\"/admin\">Open ops console</Link></Card>\n      </section>\n    </div>\n  );\n}\n","src/components/banners.tsx":"'use client'\n\nimport { useChainId, useReadContracts } from 'wagmi'\nimport { agiJobManagerAbi } from '@/abis/agiJobManager'\nimport { env } from '@/lib/env'\n\nexport function GlobalBanners({ degradedRpc }: { degradedRpc?: boolean }) {\n  const chainId = useChainId()\n  const flags = useReadContracts({\n    contracts: [\n      { abi: agiJobManagerAbi, address: env.agiJobManagerAddress, functionName: 'paused' },\n      { abi: agiJobManagerAbi, address: env.agiJobManagerAddress, functionName: 'settlementPaused' }\n    ],\n    allowFailure: true\n  })\n\n  return (\n    <div className=\"mb-4 space-y-2\">\n      {chainId !== env.chainId && <div className=\"card-shell border-warning/60 text-warning\">Network mismatch. Expected chain ID {env.chainId}.</div>}\n      {flags.data?.[0]?.result && <div className=\"card-shell border-warning/60 text-warning\">Protocol paused.</div>}\n      {flags.data?.[1]?.result && <div className=\"card-shell border-warning/60 text-warning\">Settlement paused.</div>}\n      {(degradedRpc || flags.isError) && <div className=\"card-shell border-destructive/60\">Degraded RPC mode. Retry if data appears stale.</div>}\n    </div>\n  )\n}\n","src/components/client-shell.tsx":"'use client'\n\nimport Providers from '@/components/providers'\nimport { Nav } from '@/components/layout/nav'\nimport { Footer } from '@/components/layout/footer'\nimport { GlobalBanners } from '@/components/banners'\n\nexport function ClientShell({ children, rpcMainnetUrl, rpcSepoliaUrl, degradedRpc }: { children: React.ReactNode; rpcMainnetUrl?: string; rpcSepoliaUrl?: string; degradedRpc?: boolean }) {\n  return (\n    <Providers rpcMainnetUrl={rpcMainnetUrl} rpcSepoliaUrl={rpcSepoliaUrl}>\n      <Nav />\n      <main className=\"container-shell py-8\">\n        <GlobalBanners degradedRpc={degradedRpc} />\n        {children}\n      </main>\n      <Footer />\n    </Providers>\n  )\n}\n","src/components/header.tsx":"'use client'\n\nimport Link from 'next/link'\nimport { ConnectButton } from '@rainbow-me/rainbowkit'\n\nexport function Header({ isDark, onToggleTheme, degradedRpc }: { isDark: boolean; onToggleTheme: () => void; degradedRpc: boolean }) {\n  return (\n    <header className=\"border-b border-border/80 bg-background/95 backdrop-blur\">\n      <div className=\"container-shell flex items-center justify-between py-5\">\n        <nav className=\"flex items-center gap-5 text-sm\">\n          <Link href=\"/\" className=\"font-medium\">Dashboard</Link>\n          <Link href=\"/jobs\">Jobs</Link>\n          <Link href=\"/admin\">Ops Console</Link>\n          {degradedRpc && <span className=\"pill border-yellow-500/50 text-yellow-400\">Degraded RPC</span>}\n        </nav>\n        <div className=\"flex items-center gap-3\">\n          <button className=\"btn-outline\" onClick={onToggleTheme}>{isDark ? 'Light' : 'Dark'} mode</button>\n          <ConnectButton showBalance={false} />\n        </div>\n      </div>\n    </header>\n  )\n}\n","src/components/layout/footer.tsx":"export function Footer(){return <footer className='container py-6 text-xs text-muted-foreground'>Read-only browsing works without wallet. All writes are simulation-first.</footer>}\n","src/components/layout/nav.tsx":"'use client';\nimport Link from 'next/link';\nimport { ConnectButton } from '@rainbow-me/rainbowkit';\nimport { useTheme } from 'next-themes';\nimport { useEffect, useState } from 'react';\nimport { Button } from '../ui/button';\n\nconst NAV_ROUTES = [\n  { label: 'Dashboard', pathname: '/' },\n  { label: 'Jobs', pathname: '/jobs' },\n  { label: 'Identity', pathname: '/identity' },\n  { label: 'Admin', pathname: '/admin' },\n  { label: 'Advanced', pathname: '/advanced' },\n  { label: 'Design', pathname: '/design' },\n  { label: 'Deployment', pathname: '/deployment' },\n  { label: 'Demo', pathname: '/demo' },\n];\n\nexport function Nav() {\n  const { theme, setTheme } = useTheme();\n  const [isFileProtocol, setIsFileProtocol] = useState(false);\n\n  useEffect(() => {\n    setIsFileProtocol(window.location.protocol === 'file:');\n  }, []);\n\n  return (\n    <header className=\"border-b border-border\">\n      <div className=\"container-shell flex h-16 items-center justify-between\">\n        <div className=\"font-serif text-3xl\">AGIJobManager</div>\n        <nav className=\"flex gap-4 text-sm\">\n          {NAV_ROUTES.map((route) => (\n            <Link key={route.pathname} href={route.pathname} data-testid={`top-nav-${route.label.toLowerCase()}`}>\n              {route.label}\n            </Link>\n          ))}\n        </nav>\n        <div className='flex items-center gap-2'><Button variant='outline' onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}>Theme</Button><ConnectButton showBalance={false} /></div>\n      </div>\n      {isFileProtocol && (\n        <div className=\"border-t border-amber-500/40 bg-amber-500/10 py-2 text-xs text-amber-200\" data-testid=\"file-protocol-warning\">\n          <div className=\"container-shell\">\n            file:// origin detected. Wallet injection typically requires HTTPS. Use GitHub Pages or an IPFS gateway for wallet write flows.\n          </div>\n        </div>\n      )}\n    </header>\n  );\n}\n","src/components/layout/theme-toggle.tsx":"'use client'\n\nimport { useTheme } from 'next-themes'\n\nexport function ThemeToggle() {\n  const { theme, setTheme } = useTheme()\n  return <button className=\"btn-outline\" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}>Theme</button>\n}\n","src/components/providers.tsx":"'use client';\nimport { QueryClient, QueryClientProvider } from '@tanstack/react-query';\nimport { WagmiProvider } from 'wagmi';\nimport { RainbowKitProvider, darkTheme } from '@rainbow-me/rainbowkit';\nimport { ThemeProvider } from 'next-themes';\nimport { wagmiConfig } from '@/lib/web3/config';\nimport '@rainbow-me/rainbowkit/styles.css';\nimport { useState } from 'react';\n\nexport function Providers({ children, nonce }: { children: React.ReactNode; nonce?: string; rpcMainnetUrl?: string; rpcSepoliaUrl?: string }) {\n  const [client] = useState(\n    () => new QueryClient({ defaultOptions: { queries: { retry: 2, retryDelay: (a) => Math.min(1000 * 2 ** a, 5000) } } })\n  );\n  return (\n    <ThemeProvider attribute=\"class\" defaultTheme=\"dark\" nonce={nonce}>\n      <WagmiProvider config={wagmiConfig}>\n        <QueryClientProvider client={client}>\n          <RainbowKitProvider theme={darkTheme({ accentColor: '#1d4ed8', accentColorForeground: '#ffffff' })}>{children}</RainbowKitProvider>\n        </QueryClientProvider>\n      </WagmiProvider>\n    </ThemeProvider>\n  );\n}\n\nexport default Providers;\n","src/components/tx/tx-stepper-button.tsx":"'use client'\n\nimport { verifyUSDCDeployment, assertUSDCWriteTarget, assertUSDCWalletContext, assertSimulatedUSDCRequest } from '@/lib/usdc'\nimport { ReactNode, useEffect, useMemo, useState } from 'react'\nimport { BaseError } from 'viem'\nimport { useAccount, useChainId, usePublicClient, useSimulateContract, useWaitForTransactionReceipt, useWalletClient, useWriteContract } from 'wagmi'\nimport { decodeError } from '@/lib/web3/errors'\nimport { env } from '@/lib/env'\n\nexport function TxStepperButton({ children, disabled, simulateConfig, preflightError }: { children: ReactNode; disabled?: boolean; simulateConfig: any; preflightError?: string }) {\n  const [step, setStep] = useState<'idle' | 'preparing' | 'signature' | 'pending' | 'confirmed' | 'failed'>('idle')\n  const chainId = useChainId()\n  const { isConnected, address } = useAccount()\n  const [localError, setLocalError] = useState<Error>()\n  const publicClient = usePublicClient()\n  const { data: walletClient } = useWalletClient()\n  const write = useWriteContract()\n  const sim = useSimulateContract({ ...simulateConfig, account: address, chainId: env.chainId, query: { enabled: false } })\n  const wait = useWaitForTransactionReceipt({ hash: write.data, chainId: env.chainId })\n\n  const txLink = useMemo(() => {\n    if (!write.data) return ''\n    const base = env.explorerBaseUrl || (env.chainId === 11155111 ? 'https://sepolia.etherscan.io' : 'https://etherscan.io')\n    return `${base}/tx/${write.data}`\n  }, [write.data])\n\n  const run = async () => {\n    if (!isConnected || !address || chainId !== env.chainId || preflightError) return\n    try {\n      const reviewedConfig = { ...simulateConfig, args: simulateConfig.args ? structuredClone(simulateConfig.args) : undefined }\n      setLocalError(undefined)\n      setStep('preparing')\n      await assertUSDCWalletContext(walletClient, address, env.chainId)\n      const simulated = await sim.refetch()\n      if (simulated.isError || simulated.error || !simulated.data?.request) throw simulated.error || new Error('Simulation failed')\n      const token = await verifyUSDCDeployment(publicClient, env.agiJobManagerAddress, chainId)\n      assertUSDCWriteTarget(simulated.data.request.address, env.agiJobManagerAddress, token, simulated.data.request.functionName, simulated.data.request.args)\n      assertSimulatedUSDCRequest(simulated.data.request, reviewedConfig)\n      await assertUSDCWalletContext(walletClient, address, env.chainId)\n      setStep('signature')\n      await write.writeContractAsync({ ...simulated.data.request, account: address, chainId: env.chainId })\n      setStep('pending')\n    } catch (error) {\n      setLocalError(error instanceof Error ? error : new Error(String(error)))\n      setStep('failed')\n    }\n  }\n\n  useEffect(() => {\n    if (wait.isSuccess && step === 'pending') {\n      if (wait.data?.status === 'success') setStep('confirmed')\n      else { setLocalError(new Error('Transaction reverted. Check your wallet before retrying.')); setStep('failed') }\n    }\n    if (wait.isError && step === 'pending') setStep('failed')\n  }, [wait.isSuccess, wait.isError, wait.data?.status, step])\n\n  const err = (localError || sim.error || write.error || wait.error) as BaseError | undefined\n  const decoded = decodeError(err)\n  const effectiveError = preflightError || (!isConnected ? 'Connect wallet' : chainId !== env.chainId ? 'Wrong network' : '')\n\n  return (\n    <div className=\"space-y-2\">\n      <button onClick={run} disabled={disabled || !!effectiveError || step === 'preparing' || step === 'signature' || step === 'pending'} className=\"btn-primary\">\n        {children}\n      </button>\n      {effectiveError && <p className=\"text-xs text-warning\">{effectiveError}</p>}\n      {step === 'preparing' && <p className=\"text-xs\">Preparing…</p>}\n      {step === 'signature' && <p className=\"text-xs\">Awaiting signature…</p>}\n      {step === 'pending' && txLink && <a href={txLink} className=\"text-xs underline\" target=\"_blank\" rel=\"noreferrer\">Pending in explorer</a>}\n      {step === 'confirmed' && <p className=\"text-xs text-emerald-400\">Confirmed</p>}\n      {step === 'failed' && <p className=\"text-xs text-destructive\">{decoded.name}: {decoded.human}</p>}\n    </div>\n  )\n}\n","src/components/tx/txStepper.tsx":"'use client';\nexport function TxStepper({step,error}:{step:string;error?:string}){\n  return <div className='text-xs space-y-1'><div>Step: {step}</div>{error&&<div className='text-destructive'>{error}</div>}</div>;\n}\n","src/components/tx/useSimulatedWrite.ts":"'use client';\nimport { verifyUSDCDeployment, assertUSDCWriteTarget, assertUSDCWalletContext, assertSimulatedUSDCRequest } from '@/lib/usdc';\nimport { env } from '@/lib/env';\nimport { useState } from 'react';\nimport { useAccount, usePublicClient, useWalletClient } from 'wagmi';\nimport { decodeErrorResult } from 'viem';\nimport { translateError } from '@/lib/web3/errors';\n\nexport function useSimulatedWrite(){\n  const { address, chainId } = useAccount();\n  const publicClient = usePublicClient();\n  const { data: walletClient } = useWalletClient();\n  const [step,setStep] = useState('Idle');\n  const [error,setError] = useState<string>();\n  async function run(config: any, expectedChainId:number, preflight?:()=>Promise<void>|void){\n    try {\n      const reviewedConfig = { ...config, args: config.args ? structuredClone(config.args) : undefined };\n      setError(undefined); setStep('Preparing');\n      if (!address || !walletClient) throw new Error('Connect wallet');\n      if (chainId !== expectedChainId || !publicClient) throw new Error('Network mismatch');\n      await assertUSDCWalletContext(walletClient, address, expectedChainId);\n      await preflight?.();\n      const sim = await publicClient!.simulateContract({...reviewedConfig, account: address});\n      const token = await verifyUSDCDeployment(publicClient, env.agiJobManagerAddress, expectedChainId);\n      assertUSDCWriteTarget(sim.request.address, env.agiJobManagerAddress, token, sim.request.functionName, sim.request.args);\n      assertSimulatedUSDCRequest(sim.request, reviewedConfig);\n      await assertUSDCWalletContext(walletClient, address, expectedChainId);\n      setStep('Awaiting signature');\n      const hash = await walletClient.writeContract(sim.request);\n      setStep('Pending');\n      const receipt = await publicClient.waitForTransactionReceipt({ hash });\n      if (receipt.status !== 'success') throw new Error('Transaction reverted. Check your wallet before retrying.');\n      setStep('Confirmed');\n      return hash;\n    } catch (e:any) {\n      const decoded = e?.data ? (()=>{ try{return decodeErrorResult({abi: config.abi, data: e.data});}catch{return undefined;} })() : undefined;\n      setError(decoded?.errorName ? translateError(decoded.errorName) : e?.shortMessage || e?.message || 'Transaction failed.');\n      setStep('Failed');\n      throw e;\n    }\n  }\n  return { run, step, error };\n}\n","src/components/tx-button.tsx":"export { TxStepperButton as TxButton } from '@/components/tx/tx-stepper-button'\n","src/components/ui/button.tsx":"import * as React from 'react';\nimport { cn } from '@/lib/utils';\n\ntype Props = React.ButtonHTMLAttributes<HTMLButtonElement> & { variant?: 'default' | 'outline' | 'destructive' };\nexport function Button({ className, variant='default', ...props }: Props){\n  return <button className={cn('inline-flex items-center justify-center rounded-md px-4 py-2 text-sm font-medium transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:opacity-50',variant==='default'&&'bg-primary text-primary-foreground hover:bg-accent',variant==='outline'&&'border border-border bg-transparent hover:bg-muted',variant==='destructive'&&'bg-destructive text-destructive-foreground hover:opacity-90',className)} {...props}/>;\n}\n","src/components/ui/card.tsx":"import { cn } from '@/lib/utils';\nexport function Card({className, ...props}: React.HTMLAttributes<HTMLDivElement>){return <div className={cn('rounded-lg border border-border bg-card p-4',className)} {...props}/>;}\n","src/components/ui/input.tsx":"import { cn } from '@/lib/utils';\nexport function Input(props: React.InputHTML
