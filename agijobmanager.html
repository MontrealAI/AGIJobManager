       \"assignedAt\": \"1700000000\",\n        \"completed\": false,\n        \"disputed\": false,\n        \"expired\": true,\n        \"completionRequested\": false,\n        \"completionRequestedAt\": \"0\",\n        \"disputedAt\": \"0\",\n        \"specUri\": \"file:///tmp/nope\",\n        \"completionUri\": \"\"\n      }\n    ]\n  },\n  {\n    \"key\": \"degraded-paused\",\n    \"title\": \"Degraded RPC + paused settlement\",\n    \"paused\": true,\n    \"settlementPaused\": true,\n    \"degradedRpc\": true,\n    \"owner\": \"0x1111111111111111111111111111111111111111\",\n    \"nextJobId\": \"3\",\n    \"completionReviewPeriod\": \"400\",\n    \"disputeReviewPeriod\": \"800\",\n    \"voteQuorum\": \"3\",\n    \"requiredValidatorApprovals\": \"2\",\n    \"requiredValidatorDisapprovals\": \"2\",\n    \"withdrawableUSDC\": \"0\",\n    \"jobs\": [\n      {\n        \"id\": 0,\n        \"employer\": \"0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\",\n        \"agent\": \"0x0000000000000000000000000000000000000000\",\n        \"payout\": \"0\",\n        \"duration\": \"1\",\n        \"assignedAt\": \"0\",\n        \"completed\": false,\n        \"disputed\": false,\n        \"expired\": false,\n        \"completionRequested\": false,\n        \"completionRequestedAt\": \"0\",\n        \"disputedAt\": \"0\",\n        \"specUri\": \"https://example.com/ok\",\n        \"completionUri\": \"\"\n      },\n      null,\n      {\n        \"id\": 2,\n        \"employer\": \"0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\",\n        \"agent\": \"0xcccccccccccccccccccccccccccccccccccccccc\",\n        \"payout\": \"0\",\n        \"duration\": \"3\",\n        \"assignedAt\": \"1\",\n        \"completed\": false,\n        \"disputed\": false,\n        \"expired\": false,\n        \"completionRequested\": true,\n        \"completionRequestedAt\": \"3\",\n        \"disputedAt\": \"0\",\n        \"specUri\": \"blob:https://bad\",\n        \"completionUri\": \"\"\n      }\n    ]\n  }\n]\n","src/demo/fixtures/scenarios.ts":"import rawScenarios from './scenarios.json';\n\nexport type DemoJob = {\n  id: number;\n  employer: `0x${string}`;\n  agent: `0x${string}`;\n  payout: bigint;\n  duration: bigint;\n  assignedAt: bigint;\n  completed: boolean;\n  disputed: boolean;\n  expired: boolean;\n  completionRequested: boolean;\n  completionRequestedAt: bigint;\n  disputedAt: bigint;\n  specUri: string;\n  completionUri: string;\n};\n\nexport type DemoScenario = {\n  key: string;\n  title: string;\n  paused: boolean;\n  settlementPaused: boolean;\n  degradedRpc: boolean;\n  owner: `0x${string}`;\n  nextJobId: bigint;\n  completionReviewPeriod: bigint;\n  disputeReviewPeriod: bigint;\n  voteQuorum: bigint;\n  requiredValidatorApprovals: bigint;\n  requiredValidatorDisapprovals: bigint;\n  withdrawableUSDC: bigint;\n  jobs: (DemoJob | null)[];\n};\n\ntype RawDemoJob = Omit<DemoJob, 'payout' | 'duration' | 'assignedAt' | 'completionRequestedAt' | 'disputedAt'> & {\n  payout: string;\n  duration: string;\n  assignedAt: string;\n  completionRequestedAt: string;\n  disputedAt: string;\n};\n\ntype RawScenario = Omit<DemoScenario, 'nextJobId' | 'completionReviewPeriod' | 'disputeReviewPeriod' | 'voteQuorum' | 'requiredValidatorApprovals' | 'requiredValidatorDisapprovals' | 'withdrawableUSDC' | 'jobs'> & {\n  nextJobId: string;\n  completionReviewPeriod: string;\n  disputeReviewPeriod: string;\n  voteQuorum: string;\n  requiredValidatorApprovals: string;\n  requiredValidatorDisapprovals: string;\n  withdrawableUSDC: string;\n  jobs: (RawDemoJob | null)[];\n};\n\nconst toBigInt = (value: string) => BigInt(value);\n\nconst normalizeJob = (job: RawDemoJob): DemoJob => ({\n  ...job,\n  payout: toBigInt(job.payout),\n  duration: toBigInt(job.duration),\n  assignedAt: toBigInt(job.assignedAt),\n  completionRequestedAt: toBigInt(job.completionRequestedAt),\n  disputedAt: toBigInt(job.disputedAt)\n});\n\nexport const demoScenarios: DemoScenario[] = (rawScenarios as RawScenario[]).map((scenario) => ({\n  ...scenario,\n  nextJobId: toBigInt(scenario.nextJobId),\n  completionReviewPeriod: toBigInt(scenario.completionReviewPeriod),\n  disputeReviewPeriod: toBigInt(scenario.disputeReviewPeriod),\n  voteQuorum: toBigInt(scenario.voteQuorum),\n  requiredValidatorApprovals: toBigInt(scenario.requiredValidatorApprovals),\n  requiredValidatorDisapprovals: toBigInt(scenario.requiredValidatorDisapprovals),\n  withdrawableUSDC: toBigInt(scenario.withdrawableUSDC),\n  jobs: scenario.jobs.map((job) => (job ? normalizeJob(job) : null))\n}));\n\nexport function getScenario(key?: string) {\n  return demoScenarios.find((s) => s.key === key) ?? demoScenarios[0];\n}\n","src/generated/deployment.ts":"export { OFFICIAL_DEPLOYMENTS as OFFICIAL_DEPLOYMENT } from './deployments';\n","src/generated/deployments.ts":"// Generated from config/usdc-deployment.json. Never infer deployment from historical receipts.\nexport const OFFICIAL_DEPLOYMENTS = {\n  \"version\": \"0.9.5\",\n  \"status\": \"deployment-required\",\n  \"chainId\": 1,\n  \"explorerBaseUrl\": \"https://etherscan.io\",\n  \"baseIpfsUrl\": \"https://ipfs.io/ipfs/\",\n  \"managerAddress\": \"\",\n  \"ensJobPagesAddress\": \"\",\n  \"finalOwner\": \"\",\n  \"usdc\": {\n    \"symbol\": \"USDC\",\n    \"decimals\": 6,\n    \"address\": \"0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48\"\n  },\n  \"addressSource\": \"https://developers.circle.com/stablecoins/usdc-contract-addresses\",\n  \"note\": \"Software release only; no live USDC manager is recorded here. v0.9.5 buyer-protection rules require a fresh manager and eight fixed linked libraries, including JobSettlement and JobValidation. Preserve every existing job on its original manager and namespace. Verify accepted ownership, both recipients, ENS wiring and READINESS_NFT_CONFIG before opening intake. Initial activation requires zero escrow, bonds and pending claims. Later recipient and NFT collection changes require zero live escrow and bonds; old claims retain their beneficiary.\",\n  \"settlementWallets\": {\n    \"wallet30\": \"\",\n    \"wallet10\": \"\"\n  },\n  \"settlement\": {\n    \"wallet30Percentage\": 30,\n    \"wallet10Percentage\": 10,\n    \"defaultValidatorPercentage\": 8,\n    \"validatorRateSnapshot\": \"job-posting\",\n    \"agent\": \"remaining balance\"\n  },\n  \"nftPolicy\": {\n    \"defaultRequired\": true,\n    \"snapshot\": \"job-posting\",\n    \"collectionChanges\": \"zero outstanding escrow and bonds\",\n    \"payoutEffect\": \"none\"\n  }\n} as const;\n","src/lib/bonds.ts":"export function estimateDisputeBond(payout: bigint) {\n  if (payout < 0n) throw new Error('USDC payout cannot be negative.');\n  let bond = (payout * 50n) / 10000n;\n  if (bond < 1000000n) bond = 1000000n;\n  if (bond > 200000000n) bond = 200000000n;\n  return bond > payout ? payout : bond;\n}\n","src/lib/constants.ts":"import { configuredUSDC } from './usdc';\nexport const CHAIN_ID = Number(process.env.NEXT_PUBLIC_CHAIN_ID || 1);\nexport const CONTRACT_ADDRESS = (process.env.NEXT_PUBLIC_AGI_JOB_MANAGER_ADDRESS || '0x0000000000000000000000000000000000000000') as `0x${string}`;\nexport const USDC_TOKEN_ADDRESS = configuredUSDC(Number(process.env.NEXT_PUBLIC_CHAIN_ID || 1), process.env.NEXT_PUBLIC_USDC_TOKEN_ADDRESS) as `0x${string}`;\nexport const EXPLORER = process.env.NEXT_PUBLIC_EXPLORER_BASE_URL || 'https://etherscan.io';\n\n","src/lib/demo.ts":"'use client';\nimport { useEffect, useMemo, useState } from 'react';\nimport { getScenario } from '@/demo/fixtures/scenarios';\n\nexport const isDemoMode = process.env.NEXT_PUBLIC_DEMO_MODE === '1';\n\nexport type DemoActor = 'visitor' | 'employer' | 'agent' | 'validator' | 'moderator' | 'owner';\nconst ACTORS: DemoActor[] = ['visitor', 'employer', 'agent', 'validator', 'moderator', 'owner'];\n\nfunction parseActor(input?: string | null): DemoActor {\n  const lowered = (input ?? '').toLowerCase();\n  return (ACTORS.find((a) => a === lowered) ?? (process.env.NEXT_PUBLIC_DEMO_ACTOR as DemoActor) ?? 'visitor');\n}\n\nexport function useDemoScenario() {\n  const [key, setKey] = useState<string | undefined>(undefined);\n  useEffect(() => {\n    const params = new URLSearchParams(window.location.search);\n    setKey(params.get('scenario') ?? undefined);\n  }, []);\n  return getScenario(key);\n}\n\nexport function useDemoActor() {\n  const [actor, setActor] = useState<DemoActor>(parseActor(undefined));\n\n  useEffect(() => {\n    const params = new URLSearchParams(window.location.search);\n    setActor(parseActor(params.get('actor')));\n  }, []);\n\n  return actor;\n}\n\nexport function useDemoRoleFlags() {\n  const actor = useDemoActor();\n  return useMemo(\n    () => ({\n      actor,\n      isVisitor: actor === 'visitor',\n      isEmployer: actor === 'employer',\n      isAgent: actor === 'agent',\n      isValidator: actor === 'validator',\n      isModerator: actor === 'moderator',\n      isOwner: actor === 'owner'\n    }),\n    [actor]\n  );\n}\n","src/lib/eip1193.ts":"export type Provider = { request: (args: { method: string; params?: unknown[] }) => Promise<unknown>; on?: (event: string, cb: (...args: unknown[]) => void) => void };\n\nexport async function discoverProviders(win: Window & typeof globalThis, timeoutMs = 20): Promise<Provider[]> {\n  const providers: Provider[] = [];\n  const listener = (event: Event) => {\n    const detail = (event as CustomEvent<{ provider?: Provider }>).detail;\n    if (detail?.provider) providers.push(detail.provider);\n  };\n  win.addEventListener('eip6963:announceProvider', listener as EventListener);\n  win.dispatchEvent(new Event('eip6963:requestProvider'));\n  await new Promise((resolve) => setTimeout(resolve, timeoutMs));\n  win.removeEventListener('eip6963:announceProvider', listener as EventListener);\n  const injected = (win as any).ethereum as Provider | undefined;\n  if (injected) providers.push(injected);\n  return providers;\n}\n\nexport function attachProviderRefresh(provider: Provider, refresh: () => void) {\n  if (!provider.on) return;\n  provider.on('accountsChanged', refresh);\n  provider.on('chainChanged', refresh);\n  provider.on('disconnect', refresh);\n}\n","src/lib/env.ts":"import { configuredUSDC } from './usdc';\nexport const env = {\n  chainId: Number(process.env.NEXT_PUBLIC_CHAIN_ID || '1'),\n  agiJobManagerAddress: (process.env.NEXT_PUBLIC_AGI_JOB_MANAGER_ADDRESS || '0x0000000000000000000000000000000000000000') as `0x${string}`,\n  usdcTokenAddress: configuredUSDC(Number(process.env.NEXT_PUBLIC_CHAIN_ID || 1), process.env.NEXT_PUBLIC_USDC_TOKEN_ADDRESS) as `0x${string}`,\n  ensJobPagesAddress: process.env.NEXT_PUBLIC_ENS_JOB_PAGES_ADDRESS || '',\n  walletConnectProjectId: process.env.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID || 'demo',\n  explorerBaseUrl: process.env.NEXT_PUBLIC_EXPLORER_BASE_URL || ''\n}\n","src/lib/format.ts":"import { formatUnits } from 'viem';\n\nexport const fmtAddr = (a?: string) => (a ? `${a.slice(0, 6)}...${a.slice(-4)}` : '—');\nexport const fmtToken = (v?: bigint, d = 6) => {\n  if (d !== 6) throw new Error('Only six-decimal USDC amounts are supported.');\n  if (v === undefined) return '—';\n  const [whole, fraction] = formatUnits(v < 0n ? -v : v, 6).split('.');\n  return `${v < 0n ? '-' : ''}${BigInt(whole).toLocaleString()}${fraction ? '.' + fraction : ''}`;\n};\nexport const fmtTime = (ts?: bigint | number) => (!ts ? '—' : new Date(Number(ts) * 1000).toISOString());\n\nexport const formatToken = (v?: bigint, d = 6) => (v === undefined ? '—' : `${fmtToken(v, d)} USDC`);\nexport const shortAddress = (a?: string) => (a ? `${a.slice(0, 6)}…${a.slice(-4)}` : '—');\nexport const formatTimestamp = fmtTime;\n","src/lib/job.ts":"export type JobCore = {\n  employer: `0x${string}`\n  agent: `0x${string}`\n  payout: bigint\n  createdAt: bigint\n  assignedAt: bigint\n  duration: bigint\n  completionRequestedAt: bigint\n  validatorApprovedAt: bigint\n  disputedAt: bigint\n  completed: boolean\n  cancelled: boolean\n}\n\nexport type JobValidation = { approvals: number; disapprovals: number; disputed: boolean }\n\nexport function deriveJobStatus(core: JobCore, validation: JobValidation, nowSec: number) {\n  if (core.cancelled) return 'cancelled'\n  if (core.completed) return 'settled'\n  if (validation.disputed || core.disputedAt > 0n) return 'disputed'\n  if (core.completionRequestedAt > 0n) return 'completion requested'\n  if (core.agent !== '0x0000000000000000000000000000000000000000') return nowSec > Number(core.assignedAt + core.duration) ? 'expired' : 'assigned'\n  return 'open'\n}\n\nexport function computeDeadlines(core: JobCore, periods: { completionReview: bigint; disputeReview: bigint; challengeAfterApproval: bigint }) {\n  return {\n    assignmentDeadline: core.assignedAt + core.duration,\n    completionReviewDeadline: core.completionRequestedAt + periods.completionReview,\n    disputeReviewDeadline: core.disputedAt + periods.disputeReview,\n    challengeEnd: core.validatorApprovedAt + periods.challengeAfterApproval\n  }\n}\n\nexport function roleFlags(account: `0x${string}` | undefined, owner: `0x${string}` | undefined, moderator = false) {\n  const normalized = account?.toLowerCase()\n  return {\n    isOwner: !!normalized && !!owner && normalized === owner.toLowerCase(),\n    isModerator: moderator\n  }\n}\n","src/lib/jobStatus.ts":"export type JobCore = {\n  employer?: `0x${string}`;\n  assignedAgent: `0x${string}`;\n  payout?: bigint;\n  duration: bigint;\n  assignedAt: bigint;\n  completed: boolean;\n  disputed: boolean;\n  expired: boolean;\n  agentPayoutPct?: number;\n};\nexport type JobValidation = {\n  completionRequested: boolean;\n  approvals?: number;\n  disapprovals?: number;\n  completionRequestedAt: bigint;\n  disputedAt: bigint;\n};\nexport type Params = { completionReviewPeriod: bigint; disputeReviewPeriod: bigint; challengePeriodAfterApproval?: bigint };\nexport type Status = 'Open' | 'Assigned' | 'Completion Requested' | 'Disputed' | 'Settled' | 'Expired';\n\nconst ZERO = '0x0000000000000000000000000000000000000000';\n\nexport function deriveStatus(core: JobCore, val: JobValidation): { status: Status; terminal: boolean } {\n  if (core.completed) return { status: 'Settled', terminal: true };\n  if (core.expired) return { status: 'Expired', terminal: true };\n  if (core.disputed) return { status: 'Disputed', terminal: false };\n  if (val.completionRequested) return { status: 'Completion Requested', terminal: false };\n  if (core.assignedAgent === ZERO) return { status: 'Open', terminal: false };\n  return { status: 'Assigned', terminal: false };\n}\n\n/** Demo estimates only. Live views must use getJobDeadlines, which accounts for pauses and late approvals. */\nexport function computeDeadlines(core: JobCore, val: JobValidation, p: Params) {\n  const expiryTime = core.assignedAt > 0n && core.duration > 0n ? core.assignedAt + core.duration : 0n;\n  const completionReviewEnd = val.completionRequestedAt > 0n ? val.completionRequestedAt + p.completionReviewPeriod : 0n;\n  const disputeReviewEnd = val.disputedAt > 0n ? val.disputedAt + p.disputeReviewPeriod : 0n;\n  return { expiryTime, completionReviewEnd, disputeReviewEnd, challengeEnd: 0n };\n}\n\nexport function getActionGate(status: Status, role: 'Employer' | 'Agent' | 'Validator' | 'Moderator' | 'Owner') {\n  const matrix: Record<string, Status[]> = {\n    cancelJob: role === 'Employer' ? ['Open'] : [],\n    acceptJob: role === 'Employer' ? ['Completion Requested'] : [],\n    refundUnresolvedDispute: ['Disputed'],\n    finalizeJob: ['Completion Requested'],\n    disputeJob: role === 'Employer' || role === 'Agent' ? ['Completion Requested'] : [],\n    applyForJob: role === 'Agent' ? ['Open'] : [],\n    requestJobCompletion: role === 'Agent' ? ['Assigned'] : [],\n    validateJob: role === 'Validator' ? ['Completion Requested'] : [],\n    disapproveJob: role === 'Validator' ? ['Completion Requested'] : [],\n    resolveDisputeWithCode: role === 'Moderator' ? ['Disputed'] : [],\n    lockJobENS: role === 'Owner' ? ['Settled'] : []\n  };\n  return Object.fromEntries(Object.entries(matrix).map(([k, allowed]) => [k, allowed.includes(status)]));\n}\n","src/lib/link-sanitize.ts":"export function toSafeLink(raw: string, allowHttp = false): string | null {\n  const value = String(raw || '').trim();\n  if (!value) return null;\n  const lower = value.toLowerCase();\n  if (lower.startsWith('https://') || lower.startsWith('ipfs://') || lower.startsWith('ens://')) return value;\n  if (allowHttp && lower.startsWith('http://')) return value;\n  return null;\n}\n","src/lib/security.ts":"const blocked = ['javascript:', 'data:', 'file:', 'blob:'];\nconst allowed = ['https:', 'http:', 'ipfs:', 'ens:'];\nexport function isSafeUri(uri: string) {\n  const lower = uri.trim().toLowerCase();\n  if (blocked.some((p) => lower.startsWith(p))) return false;\n  return allowed.some((p) => lower.startsWith(p));\n}\n","src/lib/usdc.ts":"import { encodeFunctionData, isAddress, zeroAddress } from 'viem';\n\nexport const USDC_DECIMALS = 6;\nexport const USDC_ADDRESSES: Record<number, `0x${string}`> = {\n  1: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48',\n  11155111: '0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238'\n};\nexport function configuredUSDC(chainId: number, configured?: string): `0x${string}` {\n  const canonical = USDC_ADDRESSES[chainId];\n  if (configured && (!canonical || configured.toLowerCase() !== canonical.toLowerCase())) {\n    throw new Error('Only canonical Circle USDC may be configured.');\n  }\n  return canonical || zeroAddress;\n}\nconst tokenAbi = [\n  ...['wallet30', 'wallet10', 'pendingOwner'].map(name => ({ type: 'function', name, stateMutability: 'view', inputs: [], outputs: [{ type: 'address' }] })),\n  { type: 'function', name: 'usdcToken', stateMutability: 'view', inputs: [], outputs: [{ type: 'address' }] },\n  { type: 'function', name: 'decimals', stateMutability: 'view', inputs: [], outputs: [{ type: 'uint8' }] }\n] as const;\n\nexport async function verifyUSDCDeployment(client: any, manager: string, chainId: number) {\n  const expected = USDC_ADDRESSES[chainId];\n  if (!expected) throw new Error('Unsupported USDC chain.');\n  if (!isAddress(manager) || manager.toLowerCase() === zeroAddress) throw new Error('Configure a verified v0.9.4 USDC deployment.');\n  if (await client.getChainId() !== chainId) throw new Error('USDC provider chain mismatch.');\n  const code = await client.getBytecode({ address: manager });\n  if (!code || code === '0x') throw new Error('USDC manager has no deployed code.');\n  const token = await client.readContract({ address: manager, abi: tokenAbi, functionName: 'usdcToken' });\n  if (String(token).toLowerCase() !== expected.toLowerCase()) throw new Error('Manager does not settle in native Circle USDC.');\n  const decimals = await client.readContract({ address: expected, abi: tokenAbi, functionName: 'decimals' });\n  if (Number(decimals) !== USDC_DECIMALS) throw new Error('USDC must have six decimals.');\n  const wallets = await Promise.all(['wallet30', 'wallet10'].map(functionName => client.readContract({ address: manager, abi: tokenAbi, functionName })));\n  const invalid = [zeroAddress, manager, expected].map(x => x.toLowerCase());\n  if (wallets.some(x => !isAddress(String(x)) || invalid.includes(String(x).toLowerCase())) || String(wallets[0]).toLowerCase() === String(wallets[1]).toLowerCase()) {\n    throw new Error('A v0.9.4 manager with distinct valid 30% and 10% settlement wallets is required.');\n  }\n  const pending = await client.readContract({ address: manager, abi: tokenAbi, functionName: 'pendingOwner' });\n  if (!isAddress(String(pending))) throw new Error('A v0.9.4 manager with two-step ownership is required.');\n  return expected;\n}\n\nexport function assertUSDCWriteTarget(address: string, manager: string, token: string, functionName: string, args: readonly unknown[] = []) {\n  if (address.toLowerCase() === manager.toLowerCase()) return;\n  if (address.toLowerCase() === token.toLowerCase() && functionName === 'approve' && String(args[0]).toLowerCase() === manager.toLowerCase()) return;\n  throw new Error('Only the verified USDC manager and its USDC approvals are supported.');\n}\n\nexport async function assertUSDCWalletContext(walletClient: any, expectedAccount: string, expectedChainId: number) {\n  if (!walletClient || !expectedAccount) throw new Error('Connect wallet.');\n  const [chainId, accounts] = await Promise.all([walletClient.getChainId(), walletClient.getAddresses()]);\n  if (chainId !== expectedChainId || String(accounts?.[0] || '').toLowerCase() !== expectedAccount.toLowerCase()) {\n    throw new Error('Wallet account or network changed. Review the action again.');\n  }\n}\n\nexport function assertSimulatedUSDCRequest(request: any, reviewed: any) {\n  const sameTarget = String(request.address).toLowerCase() === String(reviewed.address).toLowerCase();\n  const calldata = (config: any) => encodeFunctionData({ abi: config.abi, functionName: config.functionName, args: config.args });\n  if (!sameTarget || BigInt(request.value || 0) !== BigInt(reviewed.value || 0) || calldata(request) !== calldata(reviewed)) {\n    throw new Error('Transaction details changed after review. Review the action again.');\n  }\n}\n","src/lib/utils.ts":"import { clsx, type ClassValue } from 'clsx';\nimport { twMerge } from 'tailwind-merge';\n\nexport function cn(...inputs: ClassValue[]) { return twMerge(clsx(inputs)); }\n","src/lib/wagmi.ts":"'use client'\n\nimport { createConfig, fallback, http } from 'wagmi'\nimport { injected } from 'wagmi/connectors'\nimport { mainnet, sepolia } from 'wagmi/chains'\n\nexport function createWagmiConfig(rpcMainnetUrl?: string, rpcSepoliaUrl?: string) {\n  return createConfig({\n    chains: [mainnet, sepolia],\n    connectors: [injected()],\n    transports: {\n      [mainnet.id]: fallback([http(rpcMainnetUrl || 'https://eth.llamarpc.com'), http()]),\n      [sepolia.id]: fallback([http(rpcSepoliaUrl || 'https://ethereum-sepolia-rpc.publicnode.com'), http()])\n    },\n    ssr: false\n  })\n}\n","src/lib/web3/config.ts":"import { createWagmiConfig } from '@/lib/wagmi'\n\nexport const wagmiConfig = createWagmiConfig(process.env.RPC_MAINNET_URL, process.env.RPC_SEPOLIA_URL)\n","src/lib/web3/errors.ts":"import type { BaseError } from 'viem';\n\nconst map: Record<string, string> = {\n  InvalidParameters: 'Invalid parameters.',\n  InvalidState: 'Action not allowed in current job state.',\n  NotAuthorized: 'Connected wallet lacks required role.',\n  SettlementPaused: 'Settlement is paused by owner policy.',\n  Blacklisted: 'Address is blacklisted in policy.',\n  JobNotFound: 'Job slot was deleted or never existed.',\n  NotModerator: 'Only moderators can resolve this dispute.'\n};\n\nexport function decodeError(error?: BaseError | Error | unknown) {\n  const raw = String((error as any)?.shortMessage ?? (error as any)?.message ?? 'Unknown error');\n  const found = Object.keys(map).find((k) => raw.includes(k)) || (error as any)?.name;\n  return { name: found ?? 'Unknown', human: map[found ?? ''] ?? raw };\n}\n\nexport function translateError(errorName?: string) {\n  const name = errorName ?? 'Unknown';\n  return `${name}: ${map[name] ?? 'Transaction reverted.'}`;\n}\n","src/lib/web3/publicClient.ts":"import { createPublicClient, fallback, http } from 'viem';\nimport { mainnet, sepolia } from 'viem/chains';\nimport { CHAIN_ID } from '../constants';\n\nconst chain = CHAIN_ID===11155111?sepolia:mainnet;\nconst envRpc = CHAIN_ID===11155111?process.env.RPC_SEPOLIA_URL:process.env.RPC_MAINNET_URL;\nexport const publicClient = createPublicClient({ chain, transport: fallback([http(envRpc), http()]) });\n","src/lib/web3/queries.ts":"import { useQuery } from '@tanstack/react-query';\nimport { publicClient } from './publicClient';\nimport { CONTRACT_ADDRESS } from '../constants';\nimport { agiJobManagerAbi } from '@/abis/agiJobManager';\nimport type { DemoScenario } from '@/demo/fixtures/scenarios';\nimport { isDemoMode } from '@/lib/demo';\n\nexport function usePlatformSummary(scenario?: DemoScenario) {\n  return useQuery({\n    queryKey: ['platform', scenario?.key ?? 'live'],\n    queryFn: async () => {\n      if (isDemoMode && scenario) return scenario;\n      const [owner, paused, settlementPaused, nextJobId, completionReviewPeriod, disputeReviewPeriod, voteQuorum, requiredValidatorApprovals, requiredValidatorDisapprovals, withdrawableUSDC] = await Promise.all([\n        publicClient.readContract({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'owner' }),\n        publicClient.readContract({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'paused' }),\n        publicClient.readContract({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'settlementPaused' }),\n        publicClient.readContract({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'nextJobId' }),\n        publicClient.readContract({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'completionReviewPeriod' }),\n        publicClient.readContract({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'disputeReviewPeriod' }),\n        publicClient.readContract({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'voteQuorum' }),\n        publicClient.readContract({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'requiredValidatorApprovals' }),\n        publicClient.readContract({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'requiredValidatorDisapprovals' }),\n        publicClient.readContract({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'withdrawableUSDC' })\n      ]);\n      return { owner, paused, settlementPaused, nextJobId, completionReviewPeriod, disputeReviewPeriod, voteQuorum, requiredValidatorApprovals, requiredValidatorDisapprovals, withdrawableUSDC };\n    }\n  });\n}\n\nexport function useJobs(scenario?: DemoScenario) {\n  return useQuery({\n    queryKey: ['jobs', scenario?.key ?? 'live'],\n    queryFn: async () => {\n      if (isDemoMode && scenario) return scenario.jobs.filter(Boolean);\n      const nextJobId = await publicClient.readContract({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'nextJobId' });\n      const n = Number(nextJobId || 0n);\n      const contracts = Array.from({ length: n }, (_, i) => ({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'getJobCore' as const, args: [BigInt(i)] }));\n      const vals = Array.from({ length: n }, (_, i) => ({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'getJobValidation' as const, args: [BigInt(i)] }));\n      const deadlines = Array.from({ length: n }, (_, i) => ({ address: CONTRACT_ADDRESS, abi: agiJobManagerAbi, functionName: 'getJobDeadlines' as const, args: [BigInt(i)] }));\n      const [cores, validations, clockReads] = await Promise.all([publicClient.multicall({ contracts, allowFailure: true }), publicClient.multicall({ contracts: vals, allowFailure: true }), publicClient.multicall({ contracts: deadlines, allowFailure: true })]);\n      return cores.map((c, i) => ({ c, v: validations[i], i })).filter((x) => x.c.status === 'success' && x.c.result).map((x) => {\n        const r = x.c.result as readonly any[];\n        return {\n          id: x.i,\n          employer: r[0],\n          agent: r[1],\n          payout: r[2],\n          duration: r[3],\n          assignedAt: r[4],\n          completed: r[5],\n          disputed: r[6],\n          expired: r[7],\n          completionRequested: x.v.status === 'success' ? x.v.result[0] : false,\n          completionRequestedAt: x.v.status === 'success' ? x.v.result[3] : 0n,\n          disputedAt: x.v.status === 'success' ? x.v.result[4] : 0n,\n          deadlines: clockReads[x.i].status === 'success' ? clockReads[x.i].result : null,\n          specUri: '',\n          completionUri: ''\n        };\n      });\n    }\n  });\n}\n","src/lib/web3/safeUri.ts":"const ALLOWED_SCHEMES = ['https:', 'http:', 'ipfs:', 'ens:'] as const;\n\nexport function sanitizeUri(uri: string): { safe: boolean; href?: string; reason?: string } {\n  if (!uri || typeof uri !== 'string') return { safe: false, reason: 'Empty URI' };\n  const trimmed = uri.trim();\n  const lower = trimmed.toLowerCase();\n  if (['javascript:', 'data:', 'file:', 'blob:'].some((s) => lower.startsWith(s))) {\n    return { safe: false, reason: 'Blocked scheme' };\n  }\n  if (!ALLOWED_SCHEMES.some((s) => lower.startsWith(s))) return { safe: false, reason: 'Scheme not allowlisted' };\n  if (lower.startsWith('ipfs://')) {\n    return { safe: true, href: `https://ipfs.io/ipfs/${trimmed.slice('ipfs://'.length)}` };\n  }\n  if (lower.startsWith('ens://')) {\n    return { safe: true, href: `https://app.ens.domains/name/${trimmed.slice('ens://'.length)}` };\n  }\n  try {\n    const parsed = new URL(trimmed);\n    return { safe: parsed.protocol === 'https:' || parsed.protocol === 'http:', href: parsed.toString() };\n  } catch {\n    return { safe: false, reason: 'Malformed URI' };\n  }\n}\n\nexport function isAllowedUri(uri: string) {\n  return sanitizeUri(uri).safe;\n}\n","src/middleware.ts":"import { NextRequest, NextResponse } from 'next/server';\n\nexport function middleware(request: NextRequest) {\n  const nonce = Buffer.from(crypto.getRandomValues(new Uint8Array(16))).toString('base64');\n  const development = process.env.NODE_ENV === 'development';\n  const policy = [\n    \"default-src 'self'\",\n    `script-src 'self' 'nonce-${nonce}' 'strict-dynamic'${development ? \" 'unsafe-eval'\" : ''}`,\n    \"style-src 'self' 'unsafe-inline'\",\n    \"img-src 'self' data: https:\",\n    \"font-src 'self' https:\",\n    `connect-src 'self' https: wss:${development ? ' http: ws:' : ''}`,\n    \"object-src 'none'\",\n    \"base-uri 'self'\",\n    \"form-action 'self'\",\n    \"frame-ancestors 'none'\"\n  ].join('; ');\n  const headers = new Headers(request.headers);\n  // Overwrite client-supplied values; Next applies this nonce to its own scripts.\n  headers.set('x-nonce', nonce);\n  headers.set('Content-Security-Policy', policy);\n  const response = NextResponse.next({ request: { headers } });\n  response.headers.set('Content-Security-Policy', policy);\n  return response;\n}\n\nexport const config = {\n  matcher: ['/((?!_next/static|_next/image|favicon.ico|icon.svg).*)']\n};\n","src/styles/globals.css":"@tailwind base;\n@tailwind components;\n@tailwind utilities;\n\n:root {\n  --radius: 14px;\n  --background: 270 45% 97%;\n  --foreground: 275 45% 12%;\n  --card: 0 0% 100%;\n  --card-foreground: 275 45% 12%;\n  --popover: 0 0% 100%;\n  --popover-foreground: 275 45% 12%;\n  --primary: 267 64% 32%;\n  --primary-foreground: 270 25% 96%;\n  --secondary: 268 45% 92%;\n  --secondary-foreground: 275 45% 12%;\n  --muted: 250 14% 92%;\n  --muted-foreground: 240 10% 45%;\n  --accent: 261 87% 60%;\n  --accent-foreground: 0 0% 100%;\n  --destructive: 353 72% 59%;\n  --destructive-foreground: 0 0% 98%;\n  --border: 252 16% 82%;\n  --input: 252 16% 82%;\n  --ring: 261 87% 60%;\n}\n\n.dark {\n  --background: 278 100% 6%;\n  --foreground: 269 18% 92%;\n  --card: 274 59% 11%;\n  --card-foreground: 269 18% 92%;\n  --popover: 274 59% 11%;\n  --popover-foreground: 269 18% 92%;\n  --primary: 267 64% 32%;\n  --primary-foreground: 0 0% 100%;\n  --secondary: 268 40% 18%;\n  --secondary-foreground: 269 18% 92%;\n  --muted: 264 24% 21%;\n  --muted-foreground: 243 13% 68%;\n  --accent: 261 87% 60%;\n  --accent-foreground: 0 0% 100%;\n  --destructive: 353 72% 59%;\n  --destructive-foreground: 0 0% 98%;\n  --border: 269 32% 30%;\n  --input: 269 32% 30%;\n  --ring: 261 87% 60%;\n}\n\n@layer base {\n  * { @apply border-border; }\n  body { @apply bg-background text-foreground font-sans antialiased; font-feature-settings: 'tnum' 1; }\n  h1,h2,h3 { font-family: ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif; }\n}\n\n.hero-aura {\n  background: radial-gradient(circle at 22% 12%, rgba(122,63,242,.22), transparent 42%), linear-gradient(180deg, rgba(20,0,31,.65), transparent 60%);\n}\n\n@layer components {\n  .container-shell { @apply mx-auto max-w-[1280px] px-4 md:px-8; }\n  .hero { @apply rounded-[18px] p-8 shadow-sm; }\n  .card-shell { @apply rounded-[14px] border bg-card p-5 shadow-sm; }\n  .input-shell { @apply w-full rounded-[10px] border bg-background px-3 py-2 text-sm; }\n  .btn-primary { @apply rounded-[10px] bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition hover:opacity-90; }\n  .btn-outline { @apply rounded-[10px] border bg-transparent px-4 py-2 text-sm font-medium transition hover:bg-muted; }\n  .pill { @apply inline-flex items-center gap-1 rounded-full border px-3 py-1 text-xs; }\n}\n\n@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }\n","config/usdc-deployment.json":"{\n  \"version\": \"0.9.5\",\n  \"status\": \"deployment-required\",\n  \"chainId\": 1,\n  \"explorerBaseUrl\": \"https://etherscan.io\",\n  \"baseIpfsUrl\": \"https://ipfs.io/ipfs/\",\n  \"managerAddress\": \"\",\n  \"ensJobPagesAddress\": \"\",\n  \"finalOwner\": \"\",\n  \"usdc\": {\n    \"symbol\": \"USDC\",\n    \"decimals\": 6,\n    \"address\": \"0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48\"\n  },\n  \"addressSource\": \"https://developers.circle.com/stablecoins/usdc-contract-addresses\",\n  \"note\": \"Software release only; no live USDC manager is recorded here. v0.9.5 buyer-protection rules require a fresh manager and eight fixed linked libraries, including JobSettlement and JobValidation. Preserve every existing job on its original manager and namespace. Verify accepted ownership, both recipients, ENS wiring and READINESS_NFT_CONFIG before opening intake. Initial activation requires zero escrow, bonds and pending claims. Later recipient and NFT collection changes require zero live escrow and bonds; old claims retain their beneficiary.\",\n  \"settlementWallets\": {\n    \"wallet30\": \"\",\n    \"wallet10\": \"\"\n  },\n  \"settlement\": {\n    \"wallet30Percentage\": 30,\n    \"wallet10Percentage\": 10,\n    \"defaultValidatorPercentage\": 8,\n    \"validatorRateSnapshot\": \"job-posting\",\n    \"agent\": \"remaining balance\"\n  },\n  \"nftPolicy\": {\n    \"defaultRequired\": true,\n    \"snapshot\": \"job-posting\",\n    \"collectionChanges\": \"zero outstanding escrow and bonds\",\n    \"payoutEffect\": \"none\"\n  }\n}\n","README.md":"# AGIJobManager v0.9.5 — Buyer protection and resilient USDC settlement\n\nAll job payments, escrow, bonds, rewards, refunds and treasury withdrawals use six-decimal native Circle USDC. **Moving from the original-asset legacy manager requires a fresh USDC deployment.** v0.9.5 changes manager bytecode and uses eight fixed linked libraries, including `JobSettlement` and `JobValidation`. Its buyer-protection rules require a fresh manager; existing USDC and original-asset jobs stay on their original contracts. This software release does not upgrade old contracts. Start with the [USDC migration and deployment guide](docs/USDC_MIGRATION.md).\n\n**v0.9.5 protects full buyer escrow on a buyer win, removes automatic no-vote payments, requires the full review window, rejects duplicate/conflicted reviewers, freezes clocks during settlement pauses, and reserves failed outgoing payments for retry.** Buyers can explicitly accept satisfactory work; unanswered arbitration has a neutral refund deadline. [Read the simple buyer guide](docs/BUYER_PROTECTION.md). ENS membership and the per-job NFT policy remain in force. The [mainnet-fork rehearsal](docs/qualification/USDC_CUTOVER.md) covers USDC settlement, ownership, ENS wiring and preservation of existing jobs.\n\nSuccessful jobs pay validators first (**8% default**), then **30% of the original job cost to wallet one**, **10% to wallet two**, and **all remaining USDC to the agent**. For a 100 USDC job: 8 / 30 / 10 / 52. The two wallet addresses are required at deployment. The owner can rotate them only with intake paused and zero outstanding escrow or bonds; [ownership transfers require acceptance](docs/OWNER_CONTROLS.md). Validator terms are fixed when the job is posted. NFT credentials affect eligibility only; they cannot increase or reduce the agent’s payment share. See the [v0.9.5 payout and migration specification](docs/USDC_PAYOUT_SPLIT.md).\n\nAGI Agents normally qualify through a name under `agent.agi.eth` or `alpha.agent.agi.eth`; AGI Validators through `club.agi.eth` or `alpha.club.agi.eth`. The connected wallet must satisfy the configured name's NameWrapper ownership/approval or resolver-address check. Enter only the label, such as `alice`. The contract preserves owner-managed `additionalAgents`/`additionalValidators` and role-specific Merkle proofs as explicit membership exceptions; those routes are not proof of ENS membership. Agents also need a qualifying enabled NFT when the job’s posting-time NFT requirement is on (the default). These participant identity checks are separate from optional ENS job-page metadata.\n\n**[Start here](docs/START_HERE.md)** for the download, the five-step job journey, role-specific guidance and recovery from a failed or pending transaction.\n\nNew deployments start with intake paused. v0.9.5 retains the contract and toolchain hardening introduced in v0.9.1 and the ENS correction introduced in v0.9.2. See [mainnet readiness](docs/MAINNET_READINESS.md) for verified scope and the steps required for an actual deployment.\n\n[![CI][ci-badge]][ci-url]\n[![Security Verification][security-verification-badge]][security-verification-url]\n[![Docs][docs-badge]][docs-url]\n[![Security Policy][security-badge]][security-url]\n[![License][license-badge]][license-url]\n\nAGIJobManager is an Ethereum smart-contract system for escrowed AGI work agreements, with optional ENS-backed job pages managed by `ENSJobPages`.\n\n> [!IMPORTANT]\n> **New here? Download the [v0.9.5 USDC Console](https://github.com/MontrealAI/AGIJobManager/releases/download/v0.9.5/agijobmanager-usdc.html).**\n> This is the fastest operator/reviewer entry point for the standalone mainnet UI.  \n> **Repo-pinned equivalent artifact:** `ui/agijobmanager-usdc.html`  \n> **Operator guide:** `docs/ui/GENESIS_JOB_MAINNET_HTML_UI.md`\n\n## Quick links\n\n- **Launch Genesis Console:** `https://github.com/MontrealAI/AGIJobManager/releases/download/v0.9.5/agijobmanager-usdc.html`\n- **Read the operator guide:** `docs/ui/GENESIS_JOB_MAINNET_HTML_UI.md`\n- **Inspect the pinned standalone artifact:** `ui/agijobmanager-usdc.html`\n- **Deployment / contract operations:** `hardhat/README.md` and `docs/DEPLOYMENT/README.md`\n\n> **Operational policy:** intended for autonomous AI-agent execution with accountable human owner/operator oversight. This is policy intent and is not fully enforced on-chain.\n\n## Start here by role (30-second routing)\n\n- **New operator / deployer:** start with [`hardhat/README.md`](hardhat/README.md) (**official path**) and then the deployment index [`docs/DEPLOYMENT/README.md`](docs/DEPLOYMENT/README.md).\n- **Contract owner (Etherscan-first):** start with [`docs/DEPLOYMENT/OWNER_MAINNET_DEPLOYMENT_AND_OPERATIONS_GUIDE.md`](docs/DEPLOYMENT/OWNER_MAINNET_DEPLOYMENT_AND_OPERATIONS_GUIDE.md), then [`docs/OWNER_RUNBOOK.md`](docs/OWNER_RUNBOOK.md).\n- **ENSJobPages replacement operator:** use one canonical flow in [`docs/DEPLOYMENT/ENS_JOB_PAGES_MAINNET_REPLACEMENT.md`](docs/DEPLOYMENT/ENS_JOB_PAGES_MAINNET_REPLACEMENT.md).\n- **Troubleshooting during deployment/cutover:** go to [`docs/TROUBLESHOOTING_DEPLOYMENT_AND_ENS.md`](docs/TROUBLESHOOTING_DEPLOYMENT_AND_ENS.md).\n- **Standalone HTML UI operator/reviewer:** start with the [Genesis Console](https://github.com/MontrealAI/AGIJobManager/releases/download/v0.9.5/agijobmanager-usdc.html), then read [`docs/ui/GENESIS_JOB_MAINNET_HTML_UI.md`](docs/ui/GENESIS_JOB_MAINNET_HTML_UI.md). For the repo-pinned standalone artifact, see [`ui/agijobmanager-usdc.html`](ui/agijobmanager-usdc.html).\n- **Broader/full UI contributor:** use [`docs/ui/README.md`](docs/ui/README.md) for Next.js UI roadmap, runbooks, and release/testing docs.\n\n## Canonical operator answers (quick reference)\n\n- **Canonical deployment path:** Hardhat (`hardhat/README.md`). Legacy snapshot migrations are retired.\n- **Fresh USDC ENS cutover:** deploy a separate helper -> establish its ownership of a dedicated wrapped jobs-root token -> wire only the new manager and helper -> validate a full ENS lifecycle -> consider locks. Preserve the existing legacy manager, jobs, helper, root and approvals.\n- **Same-manager helper replacement:** use the [replacement runbook](docs/DEPLOYMENT/ENS_JOB_PAGES_MAINNET_REPLACEMENT.md); any existing-page migration or broader NameWrapper authority needs separate review.\n- **Canonical ENS naming format:** `<prefix><jobId>.<jobsRootName>` with default prefix `agijob`.\n- **Canonical ownership split:**\n  - `AGIJobManager owner` controls `setEnsJobPages(...)` and AGIJobManager governance.\n  - `ENS parent owner` authorizes creation of the dedicated root; manager ownership alone grants no ENS parent authority.\n  - `ENSJobPages owner` controls the helper independently; its ownership transfer takes effect in one step.\n- **Canonical safety rule:** ENS hooks are best-effort side effects; settlement/dispute outcomes remain authoritative on AGIJobManager.\n\n### Manual vs automated (do not assume)\n\n| Action | Automated by deploy scripts | Manual caller |\n| --- | --- | --- |\n| Deploy `AGIJobManager` / deploy new `ENSJobPages` | Yes | deployer key |\n| Create the dedicated root with the new helper as owner | No | ENS parent owner |\n| `AGIJobManager.setEnsJobPages(newEnsJobPages)` | No | AGIJobManager owner |\n| Existing-page migration for the same manager only | No | ENSJobPages owner (if reviewed and needed) |\n| Manager `lockIdentityConfiguration()` | No | manager owner, only after validation |\n| Helper `lockConfiguration()` | Optional via `LOCK_CONFIG=1`; leave `0` during deployment/wiring | helper owner, only after validation |\n\n## Most common owner/operator safety checks\n\nBefore any irreversible action:\n- Confirm the separate manager, helper and ENS parent owners and their actual signing paths.\n- Confirm the dedicated root is owned by the new helper and both new manager/helper pointers are correct. A fresh USDC cutover does not require blanket approval over the legacy owner’s wrapped names.\n- Confirm creation, delegated resolver writes and terminal revocation succeed without skipped or failed ENS hooks, and compare the preserved legacy inventory.\n\nIrreversible actions (delay until validated):\n- `AGIJobManager.lockIdentityConfiguration()`\n- `ENSJobPages.lockConfiguration()`\n\n## What this repository contains\n\n### UI surfaces (what exists now)\n\n- **Smart contracts (authoritative protocol state):** `contracts/` (AGIJobManager + ENSJobPages integration).\n- **Deployment/operator tooling (official):** `hardhat/` with runbooks in `docs/DEPLOYMENT/`.\n- **ENS identity layer (additive):** ENSJobPages docs in `docs/ENS/` and replacement flow in `docs/DEPLOYMENT/ENS_JOB_PAGES_MAINNET_REPLACEMENT.md`.\n- **Standalone Genesis Console surfaces:** canonical newcomer entry is the versioned USDC Console (`https://github.com/MontrealAI/AGIJobManager/releases/download/v0.9.5/agijobmanager-usdc.html`); the repo-pinned versioned standalone artifact is [`ui/agijobmanager-usdc.html`](ui/agijobmanager-usdc.html); the operator guide is [`docs/ui/GENESIS_JOB_MAINNET_HTML_UI.md`](docs/ui/GENESIS_JOB_MAINNET_HTML_UI.md); artifact inventory and broader UI references remain in [`docs/ui/STANDALONE_HTML_UIS.md`](docs/ui/STANDALONE_HTML_UIS.md), [`ui/README.md`](ui/README.md), and [`docs/ui/README.md`](docs/ui/README.md).\n- **Broader/full UI in development:** Next.js app and UI docs in [`ui/`](ui/) and [`docs/ui/README.md`](docs/ui/README.md).\n\n### UI routing (pick the right interface quickly)\n\n| If you need to... | Use this | Why |\n| --- | --- | --- |\n| Configure the versioned USDC interface after deployment | `https://github.com/MontrealAI/AGIJobManager/releases/download/v0.9.5/agijobmanager-usdc.html` + [`docs/ui/GENESIS_JOB_MAINNET_HTML_UI.md`](docs/ui/GENESIS_JOB_MAINNET_HTML_UI.md) | Fastest newcomer/operator entry point for the standalone mainnet console. |\n| Inspect the pinned standalone artifact in-repo | [`ui/agijobmanager-usdc.html`](ui/agijobmanager-usdc.html) | Repo-pinned equivalent artifact for review, provenance, and versioned inspection. |\n| Build/test the broader UI stack | [`ui/`](ui/) + [`docs/ui/README.md`](docs/ui/README.md) | Broader UI effort and development docs. |\n| Deploy/replace contracts and ENS components | [`hardhat/README.md`](hardhat/README.md) + [`docs/DEPLOYMENT/README.md`](docs/DEPLOYMENT/README.md) | Canonical deployment/operator runbooks; UI is not a deployment substitute. |\n\n> **UI safety boundary:** the standalone HTML artifact is action-capable, but contract deployment, ownership wiring, and ENS replacement authority remain in Hardhat/deployment runbooks.\n\n### Core contracts\n- `contracts/AGIJobManager.sol`: core escrow, role checks, job lifecycle, settlement, dispute flow, owner controls.\n- `contracts/ens/ENSJobPages.sol`: optional ENS per-job page manager, naming, resolver updates, permission hooks, and legacy wrapped-page migration.\n- `contracts/utils/*.sol`: linked libraries used by `AGIJobManager` in official Hardhat deployment.\n\n### Deployment tooling\n- `hardhat/`: **official/recommended** deployment and Etherscan verification flow.\n- Root contract tests: maintained Hardhat network and ethers compatibility helpers; Truffle/Ganache dependencies and historical migrations are retired.\n\n### Documentation entry points\n- Canonical deployment index: [`docs/DEPLOYMENT/README.md`](docs/DEPLOYMENT/README.md)\n- Official Hardhat operator guide: [`hardhat/README.md`](hardhat/README.md)\n- ENSJobPages replacement runbook (mainnet): [`docs/DEPLOYMENT/ENS_JOB_PAGES_MAINNET_REPLACEMENT.md`](docs/DEPLOYMENT/ENS_JOB_PAGES_MAINNET_REPLACEMENT.md)\n- ENS naming/behavior reference: [`docs/ENS/ENS_JOB_PAGES_OVERVIEW.md`](docs/ENS/ENS_JOB_PAGES_OVERVIEW.md)\n- Deployment troubleshooting: [`docs/TROUBLESHOOTING_DEPLOYMENT_AND_ENS.md`](docs/TROUBLESHOOTING_DEPLOYMENT_AND_ENS.md)\n- USDC Console (versioned download): `https://github.com/MontrealAI/AGIJobManager/releases/download/v0.9.5/agijobmanager-usdc.html`\n- Genesis Console operator guide: [`docs/ui/GENESIS_JOB_MAINNET_HTML_UI.md`](docs/ui/GENESIS_JOB_MAINNET_HTML_UI.md)\n- Pinned standalone artifact (repo): [`ui/agijobmanager-usdc.html`](ui/agijobmanager-usdc.html)\n- UI directory inventory: [`ui/README.md`](ui/README.md)\n\n## Recommended vs legacy deployment paths\n\n### Recommended (official): Hardhat\nUse Hardhat for production deployment and verification of `AGIJobManager`, and for additive `ENSJobPages` deployment/replacement.\n\nStart here: [`hardhat/README.md`](hardhat/README.md)\n\n### Retired: Truffle\nTruffle and Ganache were removed in v0.9.1. `npm test` runs the preserved contract regression suites on a local Hardhat network. Use the Hardhat guide for public-network deployment; historical Truffle commands are unsupported.\n\nLegacy docs:\n- [`docs/DEPLOYMENT/MAINNET_TRUFFLE_DEPLOYMENT.md`](docs/DEPLOYMENT/MAINNET_TRUFFLE_DEPLOYMENT.md)\n- [`docs/DEPLOYMENT/TRUFFLE_MAINNET_DEPLOY.md`](docs/DEPLOYMENT/TRUFFLE_MAINNET_DEPLOY.md)\n- [`docs/DEPLOYMENT/TRUFFLE_PRODUCTION_DEPLOY.md`](docs/DEPLOYMENT/TRUFFLE_PRODUCTION_DEPLOY.md)\n\n## ENSJobPages in one minute\n\n- `AGIJobManager` provides the numeric `jobId`.\n- `ENSJobPages` provides the label prefix (`jobLabelPrefix`, default `agijob`) and root suffix (`jobsRootName`, explicitly configured for the new deployment).\n- Effective ENS name format is: `<prefix><jobId>.<jobsRootName>`.\n- With the fork-rehearsed proposal `usdc-v095.alpha.jobs.agi.eth`, names are:\n  - `agijob0.usdc-v095.alpha.jobs.agi.eth`\n  - `agijob1.usdc-v095.alpha.jobs.agi.eth`\n- This namespace is a tested proposal, not a live deployment. The legacy `alpha.jobs.agi.eth` root remains in use by the original manager.\n- Prefix updates only affect jobs whose labels are not yet snapshotted.\n- ENS hooks are best-effort and non-fatal to core settlement; protocol settlement can succeed even when ENS writes fail.\n\nSee full behavior details: [`docs/ENS/ENS_JOB_PAGES_OVERVIEW.md`](docs/ENS/ENS_JOB_PAGES_OVERVIEW.md)\n\n## Operator quickstart\n\n1. Read the official Hardhat guide and prepare `.env` + deploy config.\n2. From the repository root, run `cd hardhat`, then `npm run compile` and the documented `DRY_RUN=1` rehearsal.\n3. Deploy `AGIJobManager` with mainnet confirmation gate.\n4. Deploy the separate `ENSJobPages` with the explicitly reviewed `JOBS_ROOT_NAME` via the documented Hardhat command.\n5. Have the ENS parent owner create the dedicated root with the new helper as its owner; the new manager owner then calls `setEnsJobPages(newEnsJobPages)`. Verify the helper also points to the new manager.\n6. Preserve the old manager, original-token obligations, helper, namespace, approvals and existing jobs. Page migration is a separate same-manager replacement procedure, not the USDC cutover.\n7. Verify source and results on Etherscan, complete two-step owner acceptance, and run the read-only deployment readiness checker while intake remains paused.\n8. Only lock identity configuration after validation is complete. The accepted owner can then open intake and reconcile a deliberately limited first job.\n\nExpected result after safe cutover:\n- New jobs use `<prefix><jobId>.<jobsRootName>` under the reviewed dedicated USDC namespace.\n- AGIJobManager lifecycle and settlement continue even if an ENS side-effect fails.\n- Legacy jobs and labels remain on their original manager and helper.\n\n### Never-do-this-by-accident checklist\n\n- Do **not** assume scripts create the dedicated root or call `setEnsJobPages(...)`; those remain manual.\n- Do **not** grant blanket NameWrapper approval or repoint legacy wiring as part of a fresh USDC cutover.\n- Do **not** call `lockConfiguration()` / `lockIdentityConfiguration()` before deploy, wiring, and migration validation.\n- Do **not** assume changing `jobLabelPrefix` rewrites existing legacy/snapshotted names.\n- Do **not** treat ENS hook failures as settlement failures; check both protocol events and ENS hook events.\n\nDetailed procedures and expected outputs:\n- [`hardhat/README.md`](hardhat/README.md)\n- [`docs/DEPLOYMENT/ENS_JOB_PAGES_MAINNET_REPLACEMENT.md`](docs/DEPLOYMENT/ENS_JOB_PAGES_MAINNET_REPLACEMENT.md)\n\n## Local development checks\n\n```bash\nnpm ci\nnpm run lint\nnpm run build\nnpm run size\nnpm test\nnpm run docs:check\nnpm run docs:ens:check\n```\n\n## Documentation\n\n- Main documentation index: [`docs/README.md`](docs/README.md)\n- UI docs hub (broader UI): [`docs/ui/README.md`](docs/ui/README.md)\n- Genesis Console operator guide: [`docs/ui/GENESIS_JOB_MAINNET_HTML_UI.md`](docs/ui/GENESIS_JOB_MAINNET_HTML_UI.md)\n- UI directory inventory: [`ui/README.md`](ui/README.md)\n- Quintessential walkthrough: [`docs/QUINTESSENTIAL_USE_CASE.md`](docs/QUINTESSENTIAL_USE_CASE.md)\n\nMaintenance commands:\n\n```bash\nnpm run docs:gen\nnpm run docs:check\nnpm run check:no-binaries\n```\n\nAlias note: `check-no-binaries` is exposed as `npm run check:no-binaries`.\n\n## Policy and legal references\n\n- Intended use policy: [`docs/POLICY/AI_AGENTS_ONLY.md`](docs/POLICY/AI_AGENTS_ONLY.md)\n- Terms & Conditions: [`docs/LEGAL/TERMS_AND_CONDITIONS.md`](docs/LEGAL/TERMS_AND_CONDITIONS.md)\n- Security policy: [`SECURITY.md`](SECURITY.md)\n\n[ci-badge]: https://img.shields.io/github/actions/workflow/status/MontrealAI/AGIJobManager/ci.yml?branch=main&style=flat-square&label=CI\n[ci-url]: https://github.com/MontrealAI/AGIJobManager/actions/workflows/ci.yml\n[security-verification-badge]: https://img.shields.io/github/actions/workflow/status/MontrealAI/AGIJobManager/security-verification.yml?branch=main&style=flat-square&label=Security%20Verification\n[security-verification-url]: https://github.com/MontrealAI/AGIJobManager/actions/workflows/security-verification.yml\n[docs-badge]: https://img.shields.io/github/actions/workflow/status/MontrealAI/AGIJobManager/docs.yml?branch=main&style=flat-square&label=Docs%20Integrity\n[docs-url]: https://github.com/MontrealAI/AGIJobManager/actions/workflows/docs.yml\n[security-badge]: https://img.shields.io/badge/Security-Policy-blue?style=flat-square\n[security-url]: ./SECURITY.md\n[license-badge]: https://img.shields.io/github/license/MontrealAI/AGIJobManager?style=flat-square\n[license-url]: ./LICENSE\n","docs/USDC_MIGRATION.md":"# v0.9.5: USDC-only settlement\n\nEvery payout, escrow, agent bond, validator bond, dispute bond, reward, refund and treasury withdrawal in v0.9.5 uses native Circle USDC with **six decimals**. One USDC is `1000000` base units; `0.000001` USDC is one base unit. No bridge, conversion, wrapped alternative or configurable settlement token is supported.\n\n## Supported chains\n\n| Chain | Chain ID | Canonical USDC |\n| --- | --- | --- |\n| Ethereum mainnet | 1 | `0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48` |\n| Ethereum Sepolia | 11155111 | `0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238` |\n\nSource: [Circle's USDC contract address registry](https://developers.circle.com/stablecoins/usdc-contract-addresses). Sepolia USDC is a test asset. Local chains 1337 and 31337 permit six-decimal mocks for tests. Other chain IDs are rejected by the constructor.\n\n## Breaking changes\n\n- `usdcToken()` is immutable. The constructor validates token code, six decimals and the canonical address on supported public chains. There is no token-address setter.\n- Treasury API: `withdrawUSDC`, `withdrawableUSDC`, `USDCWithdrawn`.\n- Deployment key: `usdcTokenAddress`; environment key: `USDC_TOKEN_ADDRESS` (Next.js: `NEXT_PUBLIC_USDC_TOKEN_ADDRESS`).\n- Amounts are six-decimal integer base units throughout. Never reuse legacy raw amounts, approvals, cached forms or snapshots. UI parsers reject excess precision rather than truncate it; new storage namespaces isolate old drafts.\n- Standalone console: `ui/agijobmanager-usdc.html`. Old versioned consoles remain available in prior Git tags. The bridge/vault flow is retired.\n- Legacy snapshot deployment migrations are retired. Use a fresh Hardhat configuration and the v0.9.5 ABI.\n\n## Economic defaults\n\n| Parameter | USDC | Base units |\n| --- | --- | --- |\n| Maximum job payout | 88,888,888 | 88888888000000 |\n| Agent minimum bond | 1 | 1000000 |\n| Agent maximum bond | 88,888,888 | 88888888000000 |\n| Validator minimum bond | 10 | 10000000 |\n| Validator maximum bond | 88,888,888 | 88888888000000 |\n| Dispute minimum / maximum | 1 / 200 | 1000000 / 200000000 |\n\nAgent bond rate remains 500 bps with duration adjustment; validator bond rate remains 1500 bps; dispute rate remains 50 bps. Bond calculations are capped at payout, with integer flooring. The default validator budget remains 8%; v0.9.5 preserves the v0.6.0 successful-job distribution: validators, 30% wallet, 10% wallet, then the agent remainder. See [the payout specification](USDC_PAYOUT_SPLIT.md). Time periods and ENS authorization remain in place; the NFT requirement is now selected by the owner for future jobs and fixed for each job at posting. These are nominal USDC defaults, not an exchange-rate conversion of old balances.\n\n## Deployment and cutover\n\nRead the [USDC cutover qualification and preservation plan](qualification/USDC_CUTOVER.md). The existing mainnet manager has live legacy obligations. Leave its manager, ENS helper, namespace, approvals and original-asset exits available. A fresh USDC manager needs a separate ENS helper and namespace because job IDs restart at zero. v0.9.5 retains the ENS resolver compatibility correction introduced in v0.9.2 and extends deployment and participant-membership qualification. The earlier frozen v0.9.1 assets do not contain that correction.\n\n**This release publishes software. It does not deploy or upgrade a live contract.** The manager bytecode changes and now links `NftEligibility`. The new policy requires a fresh manager, including when moving from an older USDC manager. Preserve old jobs, balances, allowances, ownership, ENS helpers and namespaces on their original contracts. `config/usdc-deployment.json` records `deployment-required` and intentionally leaves manager and ENS addresses empty. Earlier receipts are historical evidence, never current v0.9.5 deployment configuration. v0.6.0 implements the payout split; guarded wallet rotation and two-step ownership arrived in v0.7.0 and paused construction in v0.8.0. v0.9.1 introduced ENS/ERC-165 decoding and settlement state-ordering protections and owner-limit events. v0.9.2 corrected resolver delegation in the separately deployed ENS helper; v0.9.3 retained those protections; v0.9.5 adds the [posting-time NFT policy](NFT_POLICY.md). Receiving these code protections requires a new deployment; installing a newer console does not modify an existing manager. Older releases have their own semantics.\n\n1. Inventory existing jobs and preserve their original contracts, assets, interfaces and ENS wiring. Close or settle them only through their original lifecycle; old obligations may remain alongside the new manager. Do not import escrow, job IDs or approvals into the USDC manager.\n2. Install pinned dependencies at the root and in `hardhat/`. Copy `hardhat/deploy.config.example.cjs` to the configured local deployment file and review owner, ENS, roots and allowlists. Supply both distinct `settlementWallets` addresses (30% first, 10% second).\n3. Compile and rehearse on Sepolia with test USDC. Review all monetary limits in six-decimal units. Use the existing Hardhat dry-run and mainnet confirmation gates for an independently authorized deployment.\n4. Verify the new source, linked libraries, constructor arguments, chain, owner, `usdcToken()`, `wallet30()`, `wallet10()` and `decimals()`. Wire ENS to the new manager and verify hooks before locking configuration.\n5. Confirm the deployment receipt shows paused intake. If `acceptanceRequired` is true, the proposed owner must call `acceptOwnership()` and verify the actual owner. Configure operations before unpausing intake. See [owner controls](OWNER_CONTROLS.md).\n6. Record the real receipt; update `config/usdc-deployment.json` and regenerate the deployment registry. Configure each UI with the verified new manager. The release's default interfaces keep writes blocked until a USDC manager is configured and its chain/token checks pass.\n7. Approve only the USDC amount needed to the new manager, then rehearse a small complete lifecycle. Never approve a legacy manager through the USDC UI.\n\nThe UI's chain/token checks do not replace source/bytecode verification. ETH is still required for Ethereum gas. ENS and ERC-721 credentials remain identity and completion evidence; they are not settlement currencies. Generic rescue functions recover accidentally sent assets and do not introduce alternative job-payment currencies.\n\n## USDC operational behavior\n\nUSDC's issuer can pause transfers or block addresses. A failed token transfer reverts the whole job operation, preserving its escrow and accounting; operators must resolve the underlying transfer restriction before retrying. The regression suite models these failures and exact micro-USDC refunds. This release does not claim an independent security audit or immunity from issuer controls.\n\n## Amount examples\n\n```js\nconst { parseUSDC, formatUSDC } = require('../scripts/lib/usdc');\nparseUSDC('123.456789'); // '123456789'\nformatUSDC('1');        // '0.000001'\n```\n\n```bash\nnode scripts/etherscan/prepare_inputs.js --action create-job --payout 123.456789 --duration 1h\n```\n\nUse `npm ci`, `npm run build`, `npm run lint`, `npm test` and the UI/security gates before publication. See release validation evidence for the exact tested commit.\n","docs/ui/DEPLOYMENT_MAINNET.md":"# USDC deployment registry\n\n## Official release\n\nAGIJobManager v0.9.5. Status: **deployment-required**.\n\nSoftware release only; no live USDC manager is recorded here. v0.9.5 buyer-protection rules require a fresh manager and eight fixed linked libraries, including JobSettlement and JobValidation. Preserve every existing job on its original manager and namespace. Verify accepted ownership, both recipients, ENS wiring and READINESS_NFT_CONFIG before opening intake. Initial activation requires zero escrow, bonds and pending claims. Later recipient and NFT collection changes require zero live escrow and bonds; old claims retain their beneficiary.\n\n- Chain ID: 1\n- Manager: Not recorded\n- ENS job-page helper: Not recorded (optional)\n- Final owner: Operator must supply and verify\n- 30% recipient: Operator must supply and verify\n- 10% recipient: Operator must supply and verify\n- USDC: 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48\n- Decimals: 6\n- Address reference: https://developers.circle.com/stablecoins/usdc-contract-addresses\n\n## Constructor arguments\n\nFollow the [Hardhat deployment guide](../../hardhat/README.md), [readiness guide](../MAINNET_READINESS.md) and [deployment runbook](../DEPLOY_RUNBOOK.md). Supply the two settlement wallets and accepted owner explicitly. All monetary arguments use six-decimal base units. Preserve original-asset jobs on their existing manager; legacy deployment snapshots are not USDC configurations. The v0.9.5 buyer-protection rules change manager bytecode and use eight fixed linked libraries, including JobSettlement and JobValidation. Using these rules requires a fresh manager; preserve existing jobs on their original contracts.\n\nAGI Agents use agent.agi.eth or alpha.agent.agi.eth subnames; AGI Club validators use club.agi.eth or alpha.club.agi.eth. The contract preserves owner-managed allowlist and Merkle exceptions, and agents need a configured NFT eligibility credential only when their job requires it. NFTs are required by default; owner changes affect future jobs only. Readiness requires READINESS_NFT_CONFIG with the chosen mode and complete collection registry. Optional job-page ENS wiring is separate from member identity. Review the four membership root nodes and any exceptions in the deployment plan.\n\n## Verification\n\nCompile with pinned solc 0.8.37 and the repository settings in hardhat/hardhat.config.js (via IR, optimizer 40 runs, Shanghai target). Verify the exact source and linked libraries, constructor arguments, chain ID, owner, USDC address and decimals before configuring any UI. Record the actual deployment receipt and update config/usdc-deployment.json only after verification. This software release does not assert a live USDC deployment.\n"}};window.__AGI_CONTRACT_ABI_REGISTRY__={agiJobManager:"src/abis/agiJobManager.ts",erc20:"src/abis/erc20.ts"};window.__AGI_APP_BOOTSTRAP__=function AGIAppBootstrap(){window.__AGI_FULL_APP_MOUNT__='AGI_FULL_APP_MOUNT_V1';return window.__AGI_FULL_APP_MOUNT__;};window.__AGI_APP_BOOTSTRAP__();</script></body></html>
